// 每个 Antigravity 模型认哪些推理档位（要和 server.js 的 AGY_MODEL_EFFORTS 保持一致）。
// agy 只有 low/medium/high 三档，界面上的 xhigh/max 对它一律不存在；Claude 那两个
// 干脆不吃 --effort。选了不生效的档位比不给选更让人困惑，所以这里直接藏掉。
const AGY_EFFORT_LEVELS = {
  "gemini-3.7-flash": ["low", "medium", "high"],
  "gemini-3.6-flash": ["low", "medium", "high"],
  "gemini-3.5-flash": ["low", "medium", "high"],
  "gemini-3.1-pro": ["low", "high"],
  "gpt-oss-120b": ["medium"],
  "claude-opus-4-6-thinking": [],
  "claude-sonnet-4-6": [],
};

// null = 这家不限制，五档随便选
function effortLevelsForCurrentModel() {
  if ((getActiveProfile()?.provider || "claude") !== "antigravity") return null;
  return AGY_EFFORT_LEVELS[selectedModel] ?? ["low", "medium", "high"];
}

// 用户选的档位这个模型不认时，实际会落到哪一档。
// 这段就近逻辑必须和 server.js 的 agyEffortForModel 一致，否则界面显示的和真跑的对不上。
function effectiveEffort(levels) {
  if (!levels) return selectedEffort;
  if (!levels.length) return null;
  if (levels.includes(selectedEffort)) return selectedEffort;
  const wanted = (selectedEffort === "xhigh" || selectedEffort === "max") ? "high" : selectedEffort;
  if (levels.includes(wanted)) return wanted;
  const order = wanted === "high" ? ["high", "medium", "low"]
    : wanted === "low" ? ["low", "medium", "high"]
    : ["low", "high", "medium"];
  return order.find(level => levels.includes(level)) ?? levels[0];
}

/**
 * 保证厂商清单已就绪再判断 ">厂商"。
 * 清单是异步拉的，页面刚打开就发 ">Kimi 任务" 时它可能还是空的——那样
 * parseProviderDispatchText 匹配不上，整条消息会被当成普通文本发给当前模型，
 * 用户却以为已经派出去了。这是最难察觉的一种失败：什么都没报错。
 */
let _dispatchProvidersProbe = null;

/**
 * 保证厂商清单已就绪。并发调用共享同一次请求，失败后可以再试——
 * 用一次性布尔标记的话，第一次网络抖动就会让派发功能永久静默失效。
 */
function ensureDispatchProvidersLoaded() {
  if (_dispatchProvidersLoaded) return Promise.resolve();
  if (!_dispatchProvidersProbe) {
    _dispatchProvidersProbe = fetchDispatchProviders().finally(() => {
      _dispatchProvidersProbe = null;   // 失败就放开，下次还能再拉
    });
  }
  return _dispatchProvidersProbe;
}

function renderModelOptions(activeProfile) {

    // 收集三档模型，相同模型合并显示 tier 标签

      ["Opus",   activeProfile?.opusModel   || ""],
      ["Sonnet", activeProfile?.sonnetModel || ""],
      ["Haiku",  activeProfile?.haikuModel  || ""],

      "gpt-5.6-luna": "快速经济",

// ── Escape helpers ─────────────────────────────────────────
function escapeAttr(value) {
  return String(value).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function escapeHtml(value) {
  return String(value).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// ── Status indicator ──────────────────────────────────────
let pendingAskUserQuestion = null;

function normalizeAskUserQuestions(input) {
  const questions = Array.isArray(input?.questions) ? input.questions : input;
  return (Array.isArray(questions) ? questions : []).slice(0, 4).map((raw, index) => {
    const options = Array.isArray(raw?.options) ? raw.options.slice(0, 4).map((opt, optIndex) => ({
      label: String(opt?.label || `Option ${optIndex + 1}`).trim(),
      description: String(opt?.description || "").trim(),
    })).filter(opt => opt.label) : [];
    return {
      question: String(raw?.question || `Question ${index + 1}`).trim(),
      header: String(raw?.header || `Q${index + 1}`).trim().slice(0, 18),
      options,
      multiSelect: raw?.multiSelect === true,
    };
  }).filter(q => q.question && q.options.length > 0);
}

function clearAskUserQuestion() {
  pendingAskUserQuestion = null;
  isAwaitingAskUserQuestion = false;
  askUserQuestionEl.classList.remove("open");
  askUserQuestionEl.innerHTML = "";
}

function askQuestionHasAnswer(index) {
  const state = pendingAskUserQuestion;
  if (!state) return false;
  if (state.customSelected[index]) return !!state.customValues[index]?.trim();
  return state.selections[index]?.size > 0;
}

function updateAskUserQuestionUi() {
  const state = pendingAskUserQuestion;
  if (!state) return;
  askUserQuestionEl.querySelectorAll(".ask-option").forEach((button) => {
    const qIndex = Number(button.dataset.q);
    const optIndex = button.dataset.option != null ? Number(button.dataset.option) : null;
    const selected = button.dataset.other === "true"
      ? state.customSelected[qIndex]
      : state.selections[qIndex]?.has(optIndex);
    button.classList.toggle("selected", !!selected);
    button.setAttribute("aria-pressed", selected ? "true" : "false");
  });
  askUserQuestionEl.querySelectorAll(".ask-custom-row").forEach((row) => {
    const qIndex = Number(row.dataset.q);
    row.classList.toggle("open", !!state.customSelected[qIndex]);
  });
  const answered = state.questions.filter((_, index) => askQuestionHasAnswer(index)).length;
  const submit = askUserQuestionEl.querySelector(".ask-question-submit");
  if (submit) submit.disabled = answered !== state.questions.length;
  const status = askUserQuestionEl.querySelector(".ask-question-status");
  if (status) status.textContent = answered === state.questions.length
    ? "Ready to continue"
    : `${state.questions.length - answered} unanswered`;
}

function renderAskUserQuestion(ev) {
  const questions = normalizeAskUserQuestions(ev.questions ?? ev.input?.questions);
  if (!questions.length) return;
  pendingAskUserQuestion = {
    requestId: ev.requestId,
    questions,
    selections: questions.map(() => new Set()),
    customSelected: questions.map(() => false),
    customValues: questions.map(() => ""),
  };
  isAwaitingAskUserQuestion = true;
  hidePopup();
  updateTypingStatus("Waiting for your choice...");
  if (isGenerating && !genChipEl) showGenChip("Waiting for your choice...");
  else updateGenChip("Waiting for your choice...");

  askUserQuestionEl.innerHTML = `
    <div class="ask-question-head">
      <span class="ask-question-mark">?</span>
      <span class="ask-question-title">The agent needs your input</span>
      <button type="button" class="ask-question-close" data-ask-cancel title="Cancel" aria-label="Cancel clarification">×</button>
    </div>
    <div class="ask-question-body">
      ${questions.map((q, qIndex) => `
        <section class="ask-question-item" data-q="${qIndex}">
          <span class="ask-question-meta">${escapeHtml(q.header || `Q${qIndex + 1}`)}</span>
          <div class="ask-question-text">${escapeHtml(q.question)}</div>
          ${q.multiSelect ? '<div class="ask-question-hint">Multiple selections allowed</div>' : ""}
          <div class="ask-options">
            ${q.options.map((opt, optIndex) => `
              <button type="button" class="ask-option" data-q="${qIndex}" data-option="${optIndex}" aria-pressed="false">
                <span class="ask-option-label">${escapeHtml(opt.label)}</span>
                ${opt.description ? `<span class="ask-option-desc">${escapeHtml(opt.description)}</span>` : ""}
              </button>
            `).join("")}
            <button type="button" class="ask-option" data-q="${qIndex}" data-other="true" aria-pressed="false">
              <span class="ask-option-label">Other</span>
              <span class="ask-option-desc">Type a custom answer</span>
            </button>
          </div>
          <div class="ask-custom-row" data-q="${qIndex}">
            <textarea class="ask-custom-input" data-q="${qIndex}" rows="1" placeholder="Custom answer"></textarea>
          </div>
        </section>
      `).join("")}
    </div>
    <div class="ask-question-actions">
      <span class="ask-question-status"></span>
      <button type="button" class="ask-question-submit" disabled>Continue</button>
    </div>`;
  askUserQuestionEl.classList.add("open");
  updateAskUserQuestionUi();
  scrollBottom();
}

function buildAskUserQuestionAnswers() {
  const state = pendingAskUserQuestion;
  if (!state) return null;
  const answers = {};
  state.questions.forEach((question, qIndex) => {
    if (state.customSelected[qIndex]) {
      const custom = state.customValues[qIndex]?.trim();
      if (custom) answers[question.question] = custom;
      return;
    }
    const labels = [...state.selections[qIndex]]
      .sort((a, b) => a - b)
      .map((optIndex) => question.options[optIndex]?.label)
      .filter(Boolean);
    if (labels.length) answers[question.question] = question.multiSelect ? labels.join(", ") : labels[0];
  });
  return answers;
}

function submitAskUserQuestion() {
  const state = pendingAskUserQuestion;
  if (!state || !ws || ws.readyState !== WebSocket.OPEN) return;
  if (!state.questions.every((_, index) => askQuestionHasAnswer(index))) {
    updateAskUserQuestionUi();
    return;
  }
  ws.send(JSON.stringify({
    type: "ask_user_question_response",
    requestId: state.requestId,
    answers: buildAskUserQuestionAnswers(),
  }));
  clearAskUserQuestion();
  updateTypingStatus("Continuing...");
  updateGenChip("Continuing...");
}

askUserQuestionEl.addEventListener("click", (e) => {
  const state = pendingAskUserQuestion;
  if (!state) return;
  if (e.target.closest("[data-ask-cancel]")) {
    ws?.send(JSON.stringify({ type: "ask_user_question_cancel", requestId: state.requestId }));
    clearAskUserQuestion();
    return;
  }
  const submit = e.target.closest(".ask-question-submit");
  if (submit) {
    submitAskUserQuestion();
    return;
  }
  const option = e.target.closest(".ask-option");
  if (!option) return;
  const qIndex = Number(option.dataset.q);
  if (!Number.isInteger(qIndex) || !state.questions[qIndex]) return;
  if (option.dataset.other === "true") {
    state.customSelected[qIndex] = !state.customSelected[qIndex];
    if (state.customSelected[qIndex]) state.selections[qIndex].clear();
    updateAskUserQuestionUi();
    askUserQuestionEl.querySelector(`.ask-custom-input[data-q="${qIndex}"]`)?.focus();
    return;
  }
  const optIndex = Number(option.dataset.option);
  if (!Number.isInteger(optIndex)) return;
  state.customSelected[qIndex] = false;
  if (state.questions[qIndex].multiSelect) {
    if (state.selections[qIndex].has(optIndex)) state.selections[qIndex].delete(optIndex);
    else state.selections[qIndex].add(optIndex);
  } else {
    state.selections[qIndex].clear();
    state.selections[qIndex].add(optIndex);
  }
  updateAskUserQuestionUi();
});

askUserQuestionEl.addEventListener("input", (e) => {
  const state = pendingAskUserQuestion;
  const input = e.target.closest(".ask-custom-input");
  if (!state || !input) return;
  const qIndex = Number(input.dataset.q);
  if (!Number.isInteger(qIndex)) return;
  state.customValues[qIndex] = input.value;
  updateAskUserQuestionUi();
});

let _providerUsageLimits = {
  claude: { status: "idle" },
  codex: { status: "idle" },
};
let _usageLimitsTimer = null;
let _usageLimitsRequestSeq = 0;

const LIMIT_CLOCK_ICON = '<svg class="auth-limit-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>';

function formatLimitReset(resetAt, mode = "hm") {
  if (!resetAt) return "";
  const date = new Date(resetAt);
  if (Number.isNaN(date.getTime())) return "";
  const diff = date.getTime() - Date.now();
  if (diff <= 0) return "soon";
  const minutes = Math.ceil(diff / 60_000);
  if (mode === "dh") {
    let days = Math.floor(minutes / (24 * 60));
    let hours = Math.ceil((minutes - days * 24 * 60) / 60);
    if (hours >= 24) {
      days += 1;
      hours = 0;
    }
    return `${days}d${hours}h`;
  }
  const hours = Math.floor(minutes / 60);
  const mins = minutes - hours * 60;
  return `${hours}h${mins}min`;
}

function renderLimitWindow(label, win, resetFormat = "hm") {
  if (!win || win.usedPercent == null) return "";
  const remaining = win.remainingPercent ?? Math.max(0, 100 - win.usedPercent);
  const reset = formatLimitReset(win.resetAt, resetFormat);
  const status = remaining <= 10 ? " critical" : remaining <= 25 ? " warning" : "";
  return `<span class="auth-limit-window"><span>${escapeHtml(label)} 剩</span><span class="auth-limit-percent${status}">${remaining}%</span>${reset ? `${LIMIT_CLOCK_ICON}<span class="auth-limit-reset">${escapeHtml(reset)}</span>` : ""}</span>`;
}

function renderLimitTooltipWindow(label, win) {
  if (!win || win.usedPercent == null) return "";
  const reset = win.resetAt ? new Date(win.resetAt).toLocaleString() : "";
  return `${label} used ${win.usedPercent}%${reset ? `, resets ${reset}` : ""}`;
}

const CODEX_PLAN_LABEL = { free: "Free", plus: "Plus", pro: "Pro", team: "Team", business: "Business", enterprise: "Enterprise" };

function codexPlanSuffix() {
  const limit = _providerUsageLimits.codex;
  const planType = limit?.planType;
  if (!planType) return "";
  const label = CODEX_PLAN_LABEL[String(planType).toLowerCase()] || planType;
  return ` · ${label}`;
}

const CLAUDE_PLAN_LABEL = { free: "Free", pro: "Pro", max_5x: "Max 5x", max_20x: "Max 20x", team: "Team", enterprise: "Enterprise" };

function claudePlanSuffix() {
  const limit = _providerUsageLimits.claude;
  const planType = limit?.subscriptionType;
  if (!planType) return "";
  const label = CLAUDE_PLAN_LABEL[String(planType).toLowerCase()] || planType;
  return ` · ${label}`;
}

function renderProviderUsageLimit(provider) {
  if (provider !== "claude" && provider !== "codex") return "";
  const limit = _providerUsageLimits[provider];
  if (!limit || limit.status === "idle" || limit.status === "loading") {
    return `<span class="auth-limit-badge muted" title="Reading live usage limits">${LIMIT_CLOCK_ICON}<span class="auth-limit-text">checking</span></span>`;
  }
  if (!limit.available) {
    const title = limit.message || (limit.authenticated === false ? "Not logged in or usage is unavailable" : "Usage limits unavailable");
    return `<span class="auth-limit-badge muted" title="${escapeAttr(title)}">${LIMIT_CLOCK_ICON}<span class="auth-limit-text">unavailable</span></span>`;
  }
  const windows = [
    { label: "5h", tooltipLabel: "5h", value: limit.fiveHour, resetFormat: "hm" },
    { label: "周", tooltipLabel: "week", value: limit.week, resetFormat: "dh" },
  ].filter(item => item.value?.usedPercent != null);
  if (!windows.length) {
    return `<span class="auth-limit-badge muted" title="No usage window is currently available">${LIMIT_CLOCK_ICON}<span class="auth-limit-text">unavailable</span></span>`;
  }
  const tooltipParts = windows.map(item => renderLimitTooltipWindow(item.tooltipLabel, item.value)).filter(Boolean);
  const title = tooltipParts.length ? tooltipParts.join("; ") : "Live subscription usage";
  const html = windows
    .map(item => renderLimitWindow(item.label, item.value, item.resetFormat))
    .join('<span class="auth-limit-separator" aria-hidden="true">·</span>');
  return `<span class="auth-limit-badge" title="${escapeAttr(title)}"><span class="auth-limit-text">${html}</span></span>`;
}

async function checkProviderUsageLimits({ silent = false } = {}) {
  const seq = ++_usageLimitsRequestSeq;
  if (!silent) {
    _providerUsageLimits = {
      claude: { status: "loading" },
      codex: { status: "loading" },
    };
    renderProfileList(_profileData);
  }
  try {
    const res = await fetch("api/usage-limits", { cache: "no-store" });
    const data = await res.json().catch(() => ({}));
    if (seq !== _usageLimitsRequestSeq) return;
    if (!res.ok) throw new Error(data.error || "usage query failed");
    _providerUsageLimits = {
      claude: data.providers?.claude ?? { status: "unavailable", available: false },
      codex: data.providers?.codex ?? { status: "unsupported", available: false },
    };
  } catch (err) {
    if (seq !== _usageLimitsRequestSeq) return;
    const message = String(err?.message || err || "usage query failed");
    _providerUsageLimits = {
      claude: { status: "error", available: false, message },
      codex: { status: "error", available: false, message },
    };
  }
  renderProfileList(_profileData);
}

function startUsageLimitPolling() {
  stopUsageLimitPolling();
  void checkProviderUsageLimits();
  _usageLimitsTimer = setInterval(() => {
    if (authDialog.classList.contains("open")) void checkProviderUsageLimits({ silent: true });
  }, 60_000);
}

function stopUsageLimitPolling() {
  if (_usageLimitsTimer) clearInterval(_usageLimitsTimer);
  _usageLimitsTimer = null;
}

const authProfileList = document.getElementById("auth-profile-list");

function renderProfileList(data) {
  // activeProfileId 以本实例 localStorage 为准，与 model/effort/permission 同一机制
  const savedId = localStorage.getItem("activeProfileId");
  if (savedId && data.profiles.some(p => p.id === savedId)) {
    data = { ...data, activeProfileId: savedId };
  }
  _profileData = data;
  authProfileList.innerHTML = data.profiles.map(p => {
    const isActive = p.id === data.activeProfileId;
    const metaParts = [];
    if (p.maskedApiKey) metaParts.push(p.maskedApiKey);
    // 显示去重后的模型（opus=sonnet 时只显示一个）
    const allModels = [p.opusModel, p.sonnetModel, p.haikuModel].filter(Boolean);
    const uniqueModels = [...new Set(allModels)];
    if (uniqueModels.length) metaParts.push(uniqueModels.map(m => m.split("/").pop() || m).join(" · "));
    const meta = p.provider === "claude"
      ? (_claudeAuthStatus === true  ? `✅ 已登录${claudePlanSuffix()}`
       : _claudeAuthStatus === false ? "⚠️ 未登录 — 请在服务器运行 claude 命令完成登录"
       : "正在检测登录状态…")
      : p.provider === "codex"
      ? (_codexAuthStatus === true
          ? (_providerUsageLimits.codex?.status === "expired"
              ? "⚠️ 登录已失效 — 请重新登录 ChatGPT 账号"
              : `✅ 已登录${codexPlanSuffix()}`)
         : _codexAuthStatus === false ? "⚠️ 未登录 — 请打开 Codex 客户端完成登录"
         : "正在检测登录状态…")
      : p.provider === "antigravity"
      ? (_agyAuthStatus === true  ? "✅ Antigravity CLI 已就绪"
       : _agyAuthStatus === false ? "⚠️ 未就绪 — 请安装 agy 并运行一次完成 Google 账号登录"
       : "正在检测登录状态…")
      : metaParts.join("  ");
    const canEdit   = p.provider !== "claude";
    const canDelete = p.provider !== "claude";
    const actions = (canEdit || canDelete) ? `
      <span class="auth-profile-actions">
        ${canEdit   ? `<span class="auth-profile-edit" data-edit="${escapeAttr(p.id)}" title="编辑" aria-label="编辑" role="button">✎</span>` : ""}
        ${canDelete ? `<span class="auth-profile-del"  data-del="${escapeAttr(p.id)}"  title="删除" aria-label="删除" role="button">×</span>` : ""}
      </span>` : "";
    return `<button class="auth-profile-item${isActive ? " active" : ""}" data-id="${escapeAttr(p.id)}" role="option" aria-selected="${isActive}">
      <span class="auth-profile-check" aria-hidden="true">${isActive ? "✓" : ""}</span>
      <span class="auth-profile-info">
        <span class="auth-profile-name">${escapeHtml(p.name)}</span>
        <span class="auth-profile-meta" style="display:flex;align-items:center;gap:4px;flex-wrap:wrap">
          ${providerBadge(p.provider)}
          <span style="opacity:.65;font-size:10.5px">${escapeHtml(meta)}</span>
          ${renderProviderUsageLimit(p.provider)}
        </span>
      </span>
      ${actions}
    </button>`;
  }).join("");
  renderModelOptions(getActiveProfile());
  requestSkillRefresh();
  void fetchDispatchProviders();
}

      headers: { "Content-Type": "application/json" },

// openAccountForm: pass null/undefined to add, or a profile object to edit
function openAccountForm(existingProfile) {
  _editingProfileId = existingProfile ? existingProfile.id : null;
  showFormView();
  addErrorEl.textContent = "";

  if (existingProfile) {
    // Edit mode
    authFormTitle.textContent = "编辑账号";
    addProviderWrap.style.display = "none";
    addSubmitBtn.textContent = "保存";
    const provider = existingProfile.provider;
    _addProvider = provider;
    addNameInput.value   = existingProfile.name || "";
    addKeyInput.value    = "";  // masked — leave blank to keep existing
    addKeyInput.placeholder = "留空则保留原 Key";
    addOpusInput.value   = existingProfile.opusModel   || "";
    addSonnetInput.value = existingProfile.sonnetModel || "";
    addHaikuInput.value  = existingProfile.haikuModel  || "";
    const baseUrl = existingProfile.baseUrl || (ADD_PRESETS[provider]?.baseUrl ?? "");
    addBaseUrlInput.value = baseUrl;
    // 后端会把留空的 goodAt 填成 provider 默认值；这里认出默认值就仍留空，
    // 免得用户一保存就把默认描述固化成自定义值
    const defaultGoodAt = DEFAULT_GOOD_AT[provider] || DEFAULT_GOOD_AT.custom;
    const savedGoodAt = existingProfile.goodAt || "";
    addGoodAtInput.value = savedGoodAt === defaultGoodAt ? "" : savedGoodAt;
    addGoodAtInput.placeholder = defaultGoodAt;
    const isCustom = provider === "custom";
    addFieldBaseUrl.classList.toggle("hidden", !isCustom);
  } else {

    authFormTitle.textContent = "添加账号";
    addProviderWrap.style.display = "";
    addSubmitBtn.textContent = "确认添加";

}

  const preset      = ADD_PRESETS[provider] ?? ADD_PRESETS.custom;
  const opusModel   = addOpusInput.value.trim()   || preset.opusModel   || "";
  const sonnetModel = addSonnetInput.value.trim() || preset.sonnetModel || opusModel;
  const haikuModel  = addHaikuInput.value.trim()  || preset.haikuModel  || sonnetModel;
  const baseUrl   = provider === "custom"
    ? addBaseUrlInput.value.trim()
    : (ADD_PRESETS[provider]?.baseUrl ?? "");
  const goodAt    = addGoodAtInput.value.trim();  // 选填，留空由后端回落到默认描述
  addErrorEl.textContent = "";
  if (!isEdit && !apiKey)  { addErrorEl.textContent = "API Key 不能为空";  return; }
  if (!baseUrl && provider === "custom") { addErrorEl.textContent = "Base URL 不能为空"; return; }
  addSubmitBtn.disabled = true;
  try {

      ? { id: _editingProfileId, name, opusModel, sonnetModel, haikuModel, goodAt, ...(apiKey ? { apiKey } : {}), ...(provider === "custom" ? { baseUrl } : {}) }
      : { name, provider, apiKey, opusModel, sonnetModel, haikuModel, baseUrl, goodAt };
    const res = await fetch("api/auth-profile", { method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: isEdit ? "update" : "add", profile: profilePayload }) });
    const d = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(d.error || (isEdit ? "保存失败" : "添加失败"));

    setAuthStatus("saved", isEdit ? "已保存" : "已添加", false);

    addErrorEl.textContent = err instanceof Error ? err.message : (isEdit ? "保存失败" : "添加失败");
    setAuthStatus("error", "失败", true);
  } finally { addSubmitBtn.disabled = false; }
});

    const qrArea = document.getElementById("wechat-qr-area");

    if (data.connected) {
      statusText.innerHTML = `🟢 <strong>微信已连接</strong> (Bot ID: <code style="background: rgba(0,0,0,0.05); padding: 2px 4px; border-radius: 4px;">${data.botId}</code>)<br/><span style="font-size: 11px; color: var(--fg-color-secondary);">你现在可在微信直接向此 AI 助手发送消息，共享当前笔记知识库。</span>`;
      actionBtn.innerText = "断开微信机器人连接";
      actionBtn.style.color = "#ef4444";
      actionBtn.style.borderColor = "#fecaca";
      qrArea.style.display = "none";
      stopWechatPolling();
    } else {
      statusText.innerHTML = `🔴 <strong>微信未连接</strong><br/><span style="font-size: 11px; color: var(--fg-color-secondary);">连接后，你可在微信对话使用此助手与笔记知识库。</span>`;
      actionBtn.innerText = "连接微信机器人";
      actionBtn.style.color = "var(--fg-color)";
      actionBtn.style.borderColor = "var(--border-color)";
    }
  } catch (err) {
    console.error("Failed to fetch WeChat status", err);
  }
}

function stopWechatPolling() {
  if (wechatPollInterval) {
    clearInterval(wechatPollInterval);
    wechatPollInterval = null;
  }
  currentWechatSessionKey = null;
  document.getElementById("wechat-qr-area").style.display = "none";
  document.getElementById("wechat-verify-area").style.display = "none";
}

async function startWechatLogin() {
  const qrArea = document.getElementById("wechat-qr-area");
  const qrImg = document.getElementById("wechat-qr-img");
  const statusText = document.getElementById("wechat-status-text");
  
  statusText.innerText = "⏳ 正在生成微信登录二维码...";
  
  try {
    const res = await fetch("api/wechat/login/start", { method: "POST" });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error);

    currentWechatSessionKey = data.sessionKey;
    qrImg.src = "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=" + encodeURIComponent(data.qrcodeUrl);
    qrArea.style.display = "flex";
    statusText.innerHTML = "🟡 <strong>请扫码</strong><br/><span style='font-size:11px;'>微信扫码并确认以启动桥接器</span>";

    // Poll status every 2 seconds
    wechatPollInterval = setInterval(pollWechatStatus, 2000);
  } catch (err) {
    statusText.innerText = `❌ 生成二维码失败: ${err.message}`;
  }
}

async function pollWechatStatus(verifyCode = "") {
  if (!currentWechatSessionKey) return;
  
  let url = `api/wechat/login/poll?sessionKey=${currentWechatSessionKey}`;
  if (verifyCode) url += `&verifyCode=${encodeURIComponent(verifyCode)}`;

  try {
    const res = await fetch(url);
    const data = await res.json();
    const statusText = document.getElementById("wechat-status-text");
    const verifyArea = document.getElementById("wechat-verify-area");

    switch (data.status) {
      case "scaned":
        statusText.innerHTML = "🟡 <strong>已扫码！</strong><br/><span style='font-size:11px;'>正在微信手机端同意登录以完成绑定...</span>";
        verifyArea.style.display = "none";
        break;
      case "need_verifycode":
        statusText.innerHTML = "🟡 <strong>安全确认</strong><br/><span style='font-size:11px;'>微信要求数字配对验证...</span>";
        verifyArea.style.display = "flex";
        break;
      case "confirmed":
        statusText.innerText = "🎉 微信机器人连接成功！";
        stopWechatPolling();
        setTimeout(checkWechatStatus, 1000);
        break;
      case "expired":
        statusText.innerText = "❌ 二维码已过期，请重新点击连接。";
        stopWechatPolling();
        break;
      case "verify_code_blocked":
        statusText.innerText = "❌ 数字验证错误次数过多，请稍后重新连接。";
        stopWechatPolling();
        break;
      case "wait":
      default:
        break;
    }
  } catch (err) {
    console.error("Error polling WeChat status", err);
  }
}

document.getElementById("wechat-action-btn").addEventListener("click", async (e) => {
  const btn = e.currentTarget;
  if (btn.innerText.includes("断开")) {
    if (!confirm("确认断开此实例的微信连接吗？这会停止微信端的消息助手回复。")) return;
    try {
      await fetch("api/wechat/logout", { method: "POST" });
      checkWechatStatus();
    } catch (err) {
      alert(`断开失败: ${err.message}`);
    }
  } else {
    startWechatLogin();
  }
});

document.getElementById("wechat-verify-submit").addEventListener("click", () => {
  const input = document.getElementById("wechat-verify-input");
  const code = input.value.trim();
  if (!code) {
    alert("请输入配对码！");
    return;
  }
  pollWechatStatus(code);
  input.value = "";
});

async function saveCurrentConversation() {
  if (!currentConvId || messageLog.length === 0) return;
  const firstUser = messageLog.find(m => m.role === "user");
  const title = firstUser
    ? firstUser.text.replace(/[\n\r]+/g, " ").slice(0, 60)
    : "新对话";
  const conv = {
    id: currentConvId,
    title,
    date: new Date().toISOString(),
    sessionId: currentSessionId,
  };
  try {
    await fetch(`api/history/${conv.id}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(conv),
    });
    // 更新内存缓存，使下次打开历史面板时可立即渲染
    if (_historyCache !== null) {
      const idx = _historyCache.findIndex(h => h.id === conv.id);
      const summary = { ...conv, messageCount: messageLog.length };
      if (idx >= 0) _historyCache[idx] = { ..._historyCache[idx], ...summary };
      else _historyCache.unshift(summary);
    }
  } catch { }
}

// ── Markdown renderer ─────────────────────────────
function renderPlain(text) {
  return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
let _markedReady = false;
try {
  if (typeof marked !== "undefined") {
    marked.use({ gfm: true, breaks: true });
    _markedReady = true;
  }
} catch { }
function renderMarkdown(text) {
  if (!_markedReady) return `<pre style="white-space:pre-wrap">${renderPlain(text)}</pre>`;
  try {
    const result = marked.parse(text);
    return typeof result === "string" ? result : `<pre style="white-space:pre-wrap">${renderPlain(text)}</pre>`;
  } catch {
    return `<pre style="white-space:pre-wrap">${renderPlain(text)}</pre>`;
  }
}

function cloneJson(value) {
  if (value == null) return value;
  try {
    return JSON.parse(JSON.stringify(value));
  } catch {
    return value;
  }
}

function blockTypeLabel(type) {
  const labels = {
    sdk_event: "运行事件",
    redacted_thinking: "隐藏思考过程",
    server_tool_use: "服务端工具调用",
    web_search_tool_result: "网页搜索结果",
    web_fetch_tool_result: "网页读取结果",
    code_execution_tool_result: "代码执行结果",
    bash_code_execution_tool_result: "Bash 执行结果",
    text_editor_code_execution_tool_result: "文件编辑结果",
    tool_search_tool_result: "工具搜索结果",
    mcp_tool_use: "MCP 工具调用",
    mcp_tool_result: "MCP 工具结果",
    tool_progress: "工具进度",
    tool_use_summary: "工具摘要",
    permission_denied: "权限拒绝",
    prompt_suggestion: "提示建议",
    notification: "通知",
    task_started: "子任务已启动",
    task_progress: "子任务进行中",
    task_updated: "子任务已更新",
    task_notification: "任务通知",
    status: "状态",
    refusal: "拒绝回复",
    codex_file_change: "文件变更",
    codex_todo_list: "任务清单",
    codex_web_search: "网页搜索",
    codex_error: "Codex 错误",
  };
  return labels[type] || type || "未知信息";
}

function jsonPreview(value) {
  if (typeof value === "string") return value;
  try {
    return JSON.stringify(value, null, 2);
  } catch {
    return String(value ?? "");
  }
}

function normalizeAssistantBlocks(content, fallbackText = "") {
  const blocks = [];
  for (const item of content || []) {
    const raw = cloneJson(item);
    if (item.type === "thinking" && item.thinking) {
      blocks.push({ type: "thinking", thinking: item.thinking, signature: item.signature ?? null, raw });
    } else if (item.type === "redacted_thinking") {
      blocks.push({ type: "redacted_thinking", data: item.data ?? null, raw });
    } else if (item.type === "text" && item.text) {
      blocks.push({ type: "text", text: item.text, citations: item.citations ?? null, raw });
    } else if (item.type === "refusal") {
      blocks.push({ type: "refusal", text: item.refusal ?? "", raw });
    } else if (item.type === "tool_use" || item.type === "server_tool_use" || item.type === "mcp_tool_use") {
      blocks.push({
        type: item.type,
        id: item.id ?? "",
        name: item.name ?? "tool",
        serverName: item.server_name ?? item.serverName ?? null,
        input: item.input ?? {},
        raw,
      });
    } else {
      blocks.push({
        type: item.type || "unknown",
        raw,
      });
    }
  }
  if (!blocks.some((block) => block.type === "text") && fallbackText) {
    blocks.push({ type: "text", text: fallbackText });
  }
  return blocks;
}

function textFromAssistantBlocks(blocks) {
  return (blocks || [])
    .filter((block) => (block.type === "text" || block.type === "refusal") && block.text)
    .map((block) => block.text)
    .join("\n\n");
}

function appendAssistantBlock(body, block) {
  if (block.type === "thinking" && block.thinking) {
    const el = document.createElement("details");
    el.className = "thinking-block";
    el.innerHTML = `<summary class="thinking-summary"><span class="thinking-dot"></span><span class="thinking-label">思考过程</span><span class="thinking-chevron">▶</span></summary><div class="thinking-content"></div>`;
    el.querySelector(".thinking-content").textContent = block.thinking;
    body.appendChild(el);
    return;
  }

  if (block.type === "redacted_thinking") {
    body.appendChild(makeHistoryBlock("隐藏思考过程", block.raw ?? block.data ?? block, "该思考内容由 Claude 加密或隐藏，原始数据已保存在历史记录中。"));
    return;
  }

  if (block.type === "text" && block.text) {
    const el = document.createElement("div");
    el.className = "msg-text";
    el.innerHTML = renderMarkdown(block.text);
    body.appendChild(el);
    return;
  }

  if (block.type === "refusal" && block.text) {
    body.appendChild(makeHistoryBlock("拒绝回复", block.raw ?? block, block.text));
    return;
  }

  if (block.type === "tool_use" || block.type === "server_tool_use" || block.type === "mcp_tool_use") {
    // Task 的派生已经由编队卡表达，别再重复渲染成一行普通工具调用
    if (isSubagentTool(block.name) && squadCards.get(activeSquad)?.has(block.id)) return;
    body.appendChild(makeToolEl(block));
    return;
  }

  if (block.type === "web_search_tool_result" || block.type === "web_fetch_tool_result") {
    body.appendChild(makeSearchResultBlock(block));
    return;
  }

  if (block.type === "tool_result" || block.type === "mcp_tool_result" || block.type?.includes("tool_result")) {
    body.appendChild(makeHistoryBlock(blockTypeLabel(block.type), block.raw ?? block));
    return;
  }

  if (block.type === "squad") {
    // 从实例状态重建整张卡 —— assistant 事件的全量重渲染不会丢展开态。
    // 历史回放时实例已不在（新会话），用 block 里的快照还原。
    let card = squadCards.get(block.squadId);
    if (!card && block.snapshot) card = SquadCard.fromSnapshot(block.squadId, block.snapshot);
    if (card) body.appendChild(card.render());
    return;
  }

  if (block.type === "task_status") {
    body.appendChild(makeTaskStatusEl(block));
    return;
  }

  if (block.type === "sdk_event") {
    const label = blockTypeLabel(block.eventType) || "运行事件";
    body.appendChild(makeHistoryBlock(label, block.raw ?? block));
    return;
  }

  body.appendChild(makeHistoryBlock(blockTypeLabel(block.type), block.raw ?? block));
}

function renderAssistantBlocks(body, blocks) {
  for (const block of blocks || []) appendAssistantBlock(body, block);
  // 失败态在 tool_result 里，而它排在 tool_use 之后 —— 全部铺完再回头标注，
  // 否则刷新一次页面，出错的工具就跟成功的长得一模一样了
  applyToolFailuresFromBlocks(body, blocks);
}

function applyToolFailuresFromBlocks(body, blocks) {
  for (const block of blocks || []) {
    const raw = block?.raw ?? block;
    const results = raw?.message?.content ?? (isToolResultType(block?.type) ? [raw] : null);
    for (const r of results ?? []) {
      if (r?.type?.includes("tool_result") && r.is_error && r.tool_use_id) {
        body.querySelector(`.tool-call[data-tool-id="${cssEscapeValue(r.tool_use_id)}"]`)?.classList.add("failed");
      }
    }
  }
}

/* 在跑就必须有一个进行中指示器。各条渲染路径各自去建太容易漏：新一轮沿用
   上一条 assistant 气泡时，typing 不会重建、chip 也没人创建，于是会出现一段
   "明明在跑、界面上却看不出来"的空窗。这条不变量在这里收口。 */
function ensureProgressIndicator() {
  if (!isGenerating) return;
  if (document.getElementById("typing") || genChipEl) return;
  if (assistantEl) showGenChip("");
  else addTyping();
}

function setGenerating(v, notifyParent = true) {
  isGenerating = v;
  if (!v) {
    stopRequested = false;
    stopResendPending = false;
    removeGenChip();
    /* 不生成了就不该还有东西在转。原来 spinner 只在收到 tool_result 时才停，
       所以中止、报错、断线这些路径下它会一直转到你刷新页面为止 ——
       一个永远在转的指示器比没有指示器更糟，它在说谎。 */
    cleanupRunningTools();
  } else {
    ensureProgressIndicator();
  }

  syncComposerAction();
  // 前台轮结束时，后台任务若还在跑要接手表达 —— 发送键保持可用
  updateBackgroundActivity();
  if (notifyParent) postParentMessage({ type: "ai-generating-state", isGenerating: v });
}

// ── Note context (injected by parent via postMessage) ─────
let currentNoteFile = null;
let noteContextEnabled = true;
let vaultNotes = [];
const selectedMentionNotes = new Map();

function renderNoteContext() {
  if (!currentNoteFile) {
    contextChip.classList.remove("visible");
    return;
  }
  const fileName = currentNoteFile.split("/").pop().replace(/\.(md|html?)$/i, "");
  ctxPathEl.textContent = fileName;
  contextChip.classList.add("visible");
  contextChip.classList.toggle("context-disabled", !noteContextEnabled);
  ctxToggle.setAttribute("aria-pressed", noteContextEnabled ? "true" : "false");
  ctxToggle.title = noteContextEnabled ? "不发送当前笔记上下文" : "发送当前笔记上下文";
}

function normalizeMentionSearch(value) {
  return String(value ?? "").normalize("NFKC").trim().toLocaleLowerCase();
}

function normalizeVaultNotes(notes) {
  const seen = new Set();
  const normalized = [];
  for (const candidate of Array.isArray(notes) ? notes : []) {
    if (!candidate || typeof candidate.path !== "string" || typeof candidate.title !== "string") continue;
    // 路径必须原样保留：文件名在 macOS/Linux 可含前后空格，trim 会指向错误文件、
    // 甚至与其他路径碰撞去重。只对标题/搜索词做规整。
    const path = candidate.path;
    const title = candidate.title.trim();
    if (!path.trim() || !title || seen.has(path)) continue;
    seen.add(path);
    const aliases = Array.isArray(candidate.aliases)
      ? candidate.aliases.map((alias) => String(alias ?? "").trim()).filter(Boolean)
      : [];
    normalized.push({
      path,
      title,
      aliases,
      searchTitle: normalizeMentionSearch(title),
      searchPath: normalizeMentionSearch(path.replace(/\.(md|html?)$/i, "")),
      searchAliases: aliases.map(normalizeMentionSearch),
      kind: candidate.kind || "markdown",
    });
  }
  return normalized;
}

function renderMentionChips() {
  const notes = [...selectedMentionNotes.values()];
  mentionChipsEl.classList.toggle("visible", notes.length > 0);
  mentionChipsEl.innerHTML = notes.map((note) => `
    <span class="mention-context-chip" title="${escapeAttr(note.path)}">
      <svg class="mention-context-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="14 2 14 8 20 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="mention-context-title">${escapeHtml(note.title)}</span>
      <button type="button" class="mention-context-remove" data-path="${escapeAttr(note.path)}" aria-label="移除笔记 ${escapeAttr(note.title)}">×</button>
    </span>
  `).join("");
}

function clearMentionNotes() {
  selectedMentionNotes.clear();
  renderMentionChips();
}

mentionChipsEl.addEventListener("click", (e) => {
  const removeButton = e.target.closest(".mention-context-remove");
  if (!removeButton) return;
  selectedMentionNotes.delete(removeButton.dataset.path);
  renderMentionChips();
  promptEl.focus();
});

function postParentMessage(message) {
  if (window.parent === window || !parentOrigin) return false;
  try {
    // Opaque custom-protocol origins cannot be named as a postMessage target.
    // The payload is non-sensitive, and the destination is still window.parent only.
    const payload = isDesktopEmbed
      ? { ...message, __token: configuredParentToken }
      : message;
    window.parent.postMessage(payload, parentOrigin === "null" ? "*" : parentOrigin);
    return true;
  } catch {
    return false;
  }
}

function isTrustedParentMessage(event) {
  if (window.parent === window || event.source !== window.parent) return false;
  if (!parentOrigin || event.origin !== parentOrigin) return false;
  // 桌面嵌入额外要求 sidecar 校验过的会话 token：sandbox iframe 可把 origin 伪造成 "null"
  // 冒充本机宿主，仅凭 Origin 挡不住；token 由宿主经 query 注入、跨域不可读，攻击者
  // 无法伪造。非桌面（同源 web 嵌入）已由同源 Origin 保证，无需 token。
  if (isDesktopEmbed) {
    return Boolean(configuredParentToken) && event.data?.__token === configuredParentToken;
  }
  return true;
}

window.addEventListener("message", (e) => {
  if (!isTrustedParentMessage(e)) return;
  if (e.data?.type === "vault-notes") {
    vaultNotes = normalizeVaultNotes(e.data.notes);
    for (const path of selectedMentionNotes.keys()) {
      const refreshed = vaultNotes.find((note) => note.path === path);
      if (refreshed) selectedMentionNotes.set(path, refreshed);
      else selectedMentionNotes.delete(path);
    }
    renderMentionChips();
  }
  if (e.data?.type === "note-context") {
    const nextFile = typeof e.data.filePath === "string" && e.data.filePath ? e.data.filePath : null;
    const isNewFile = currentNoteFile !== nextFile;
    currentNoteFile = nextFile;
    if (isNewFile) noteContextEnabled = true;
    renderNoteContext();
  }
  if (e.data?.type === "note-selection" && e.data.text) {
    quotedText = e.data.text;
    quotedSection = e.data.section ?? null;
    quotedPrefix = e.data.prefix ?? null;
    quotedSuffix = e.data.suffix ?? null;
    const lines = quotedText.split("\n").filter(l => l.trim()).length;
    const preview = quotedText.length > 55 ? quotedText.slice(0, 55) + "…" : quotedText;
    quoteTextEl.textContent = preview;
    quoteLinesEl.textContent = `(${lines} 行)`;
    quoteChip.classList.add("visible");
  }
  if (e.data?.type === "note-selection-clear") {
    quotedText = null;
    quotedSection = null;
    quotedPrefix = null;
    quotedSuffix = null;
    quoteChip.classList.remove("visible");
  }
  if (e.data?.type === "note-ask" && e.data.text) {
    submitRequest(e.data.text, { consumeComposer: false, noteFile: e.data.filePath ?? null });
  }
  if (e.data?.type === "focus-input") {
    promptEl.focus();
  }
});
