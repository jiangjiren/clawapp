// ── WebSocket ─────────────────────────────────────────────
const urlParams = pageParams;
const wsPort = urlParams.get('wsPort');
const wsTokenQuery = isDesktopEmbed && configuredParentToken
  ? `?token=${encodeURIComponent(configuredParentToken)}`
  : "";
const wsUrl = wsPort
  ? `${location.protocol === "https:" ? "wss:" : "ws:"}//${location.hostname}:${wsPort}/${wsTokenQuery}`
  : `${location.protocol === "https:" ? "wss:" : "ws:"}//${location.host}${location.pathname}${wsTokenQuery}`;
let ws = null;

function connect() {
  ws = new WebSocket(wsUrl);
  ws.onopen = () => {
    syncComposerAction();
    if (resetRequested) sendResetRequest();
    else resendPendingRequest();
    if (!pendingRequestDraft) flushLocalSteering();
    requestSkillRefresh(true);
    postParentMessage({ type: "agent-ready" });
    clearTimeout(connectionStateSyncTimer);
    connectionStateSyncTimer = setTimeout(() => {
      if (ws?.readyState !== WebSocket.OPEN) return;
      postParentMessage({ type: "ai-generating-state", isGenerating });
      flushLocalSteering();
    }, 100);
  };
  ws.onclose = () => {
    clearTimeout(connectionStateSyncTimer);
    if (stopRequested) stopResendPending = true;
    for (const item of steeringQueue) {
      if (!item.serverOwned && item.sent) item.sent = false;
    }
    postParentMessage({ type: "agent-not-ready" });
    syncComposerAction();
    setTimeout(connect, 3000);
  };
  ws.onerror = () => { };
  ws.onmessage = (e) => {
    try { handleEvent(JSON.parse(e.data)); } catch { }
    // 每有动静就校正一次"在跑就有指示器"，省得逐条渲染路径去补
    ensureProgressIndicator();
  };
}
connect();
syncComposerAction();

// Dead-socket detector: the server sends {type:"ping"} every 30s, so a healthy
// connection never goes silent for long — regardless of how long the AI task runs.
// If we're generating and nothing (not even a ping) arrives for CLIENT_STALL_MS,
// the socket died without firing onclose. Force-close it: the reconnect loop takes
// over and the server reattaches the still-running task, so nothing is lost.
const CLIENT_STALL_MS = 120_000; // 2 min without any message (pings come every 30s)
function checkClientStall() {
  if (isGenerating && !isAwaitingAskUserQuestion && lastWsEventAt > 0 && Date.now() - lastWsEventAt > CLIENT_STALL_MS) {
    lastWsEventAt = 0;
    try { ws.close(); } catch { }
  }
}
setInterval(checkClientStall, 15_000);
// Mobile: JS timers pause when tab is backgrounded, so the interval above never fires.
// visibilitychange fires immediately when the user returns, giving instant recovery.
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) checkClientStall();
});

// ── Slash commands ────────────────────────────────────────
const BUILTIN = [
  { name: "clear",       desc: "清空对话，开启新 session",  kind: "builtin" },
  { name: "compact",     desc: "压缩对话上下文以节省 token", kind: "builtin" },
  { name: "context",     desc: "查看当前上下文窗口用量",    kind: "builtin" },
  { name: "memory",      desc: "管理 Claude 记忆",          kind: "builtin" },
  { name: "model",       desc: "切换当前会话的模型",        kind: "builtin" },
  { name: "usage",       desc: "查看 API 用量和费用",       kind: "builtin" },
  { name: "status",      desc: "查看会话状态",              kind: "builtin" },
  { name: "help",        desc: "显示帮助信息",              kind: "builtin" },
  { name: "doctor",      desc: "诊断配置问题",              kind: "builtin" },
  { name: "permissions", desc: "管理工具权限",              kind: "builtin" },
];

let slashCommands = [...BUILTIN];
let currentSkillProvider = null;

function buildCommandList(skills) {
  slashCommands = [
    ...BUILTIN,
    ...skills.map((s) => ({ name: s, desc: "", kind: "skill" })),
  ];
}

function activeSkillProvider() {
  return getActiveProfile()?.provider === "codex" ? "codex" : "claude";
}

function requestSkillRefresh(force = false) {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  const provider = activeSkillProvider();
  if (!force && provider === currentSkillProvider) return;
  currentSkillProvider = provider;
  ws.send(JSON.stringify({
    type: "skills",
    provider,
    profileId: _profileData.activeProfileId,
  }));
}

// ── State ─────────────────────────────────────────────────
let assistantEl   = null;
let assistantTxt  = "";   // full text across all turns (for saving)
let assistantBlocks = [];  // rich blocks for history restore
let assistantRawMessages = []; // original assistant messages for maximum-fidelity history
let assistantEvents = []; // non-content SDK events that still explain the AI turn
  let blockMap      = {};   // block index → { el, type, accumulated }
  let prevTurnTexts = [];   // text from earlier turns within same response

  function isToolUseType(type) {
    return type === "tool_use" || type === "server_tool_use" || type === "mcp_tool_use";
  }

  function isToolResultType(type) {
    return type === "tool_result" || type === "mcp_tool_result" || type?.includes("tool_result");
  }

  function isToolResultEvent(ev) {
    const content = ev?.message?.content ?? ev?.content ?? [];
    const items = Array.isArray(content) ? content : [content];
    return items.some((item) => isToolResultType(item?.type));
  }

  function markToolRunning(el) {
    if (!el || el.classList.contains("running")) return;
    el.classList.add("running");
    if (!el.querySelector(".tool-spinner")) {
      const spinner = document.createElement("span");
      spinner.className = "tool-spinner";
      el.appendChild(spinner);
    }
  }

  function cssEscapeValue(value) {
    if (window.CSS?.escape) return CSS.escape(value);
    return String(value).replace(/["\\]/g, "\\$&");
  }

  function markLiveToolBlocksRunning(blocks) {
    if (!assistantEl) return;
    for (const block of blocks || []) {
      if (!isToolUseType(block.type)) continue;
      const selector = block.id
        ? `.tool-call[data-tool-id="${cssEscapeValue(block.id)}"]`
        : ".tool-call:last-of-type";
      const el = assistantEl.querySelector(selector);
      markToolRunning(el);
    }
  }

  function cleanupRunningTools() {
    if (!assistantEl) return;
    assistantEl.querySelectorAll(".tool-call.running").forEach(el => {
      el.classList.remove("running");
      el.querySelector(".tool-spinner")?.remove();
    });
  }

  /* 按 tool_use_id 给具体那一条工具落状态。失败是唯一需要抢注意力的结果 ——
     成功就静默收尾，满屏成功调用不该满屏都在喊。 */
  function markToolSettled(toolUseId, isError) {
    if (!assistantEl || !toolUseId) return;
    const el = assistantEl.querySelector(`.tool-call[data-tool-id="${cssEscapeValue(toolUseId)}"]`);
    if (!el) return;
    el.classList.remove("running");
    el.querySelector(".tool-spinner")?.remove();
    el.classList.toggle("failed", !!isError);
  }

function resetAssistantState() {
  cleanupRunningTools();
  removeGenChip();
  // 上一回合遗留的编队卡不该被下一回合的派生复用
  resetSquads();
  updateBackgroundActivity();
  assistantEl = null; assistantTxt = ""; assistantBlocks = []; assistantRawMessages = []; assistantEvents = []; blockMap = {}; prevTurnTexts = [];
}

function captureAssistantEvent(ev) {
  if (!ev?.type || ev.type === "user") return;
  const raw = cloneJson(ev);
  const block = { type: "sdk_event", eventType: ev.type, raw };
  assistantEvents.push(raw);
  assistantBlocks.push(block);
  if (!assistantEl) { removeTyping(); assistantEl = addMessage("assistant", ""); }
  if (!genChipEl && isGenerating) showGenChip("");
  const body = assistantEl.querySelector(".msg-body");
  appendAssistantBlock(body, block);
  reanchorGenChip();
  scrollBottom();
}

function finishGenerationAndContinue(requestId = null) {
  if (activeRequestId && requestId !== activeRequestId) return false;
  if (pendingRequestDraft && (!requestId || pendingRequestDraft.userMessageId === requestId)) {
    pendingRequestDraft = null;
  }
  activeRequestId = null;
  clearTimeout(errorCompletionTimer);
  errorCompletionTimer = null;
  clearAskUserQuestion();
  resetAssistantState();
  setGenerating(false);
  removeTyping();
  return true;
}

function finishGenerationAfterError(requestId = null) {
  clearTimeout(errorCompletionTimer);
  // The server normally follows error with done. Waiting briefly prevents that
  // old done from arriving after the next queued run has already started.
  errorCompletionTimer = setTimeout(() => {
    errorCompletionTimer = null;
    finishGenerationAndContinue(requestId);
  }, 1000);
}

const TASK_EVENT_TYPES = new Set([
  "task_started",
  "task_progress",
  "task_updated",
  "task_notification",
]);

function taskEventId(ev) {
  return String(ev.task_id ?? ev.taskId ?? ev.tool_use_id ?? ev.toolUseID ?? "task");
}

function taskEventType(ev) {
  return ev.type === "system" ? ev.subtype : ev.type;
}

function taskEventText(ev) {
  const status = String(ev.status ?? ev.patch?.status ?? ev.task?.status ?? "").trim().toLowerCase();
  const statusLabels = {
    pending: "等待中",
    running: "进行中",
    in_progress: "进行中",
    completed: "已完成",
    complete: "已完成",
    success: "已完成",
    failed: "失败",
    error: "失败",
    stopped: "已停止",
    killed: "已停止",
    paused: "已暂停",
    cancelled: "已取消",
    canceled: "已取消",
  };
  const base = statusLabels[status] || blockTypeLabel(taskEventType(ev));
  const candidates = [
    ev.description,
    ev.summary,
    ev.message,
    ev.subject,
    ev.task?.description,
    ev.task?.summary,
    ev.patch?.description,
    ev.patch?.error,
    ev.data?.description,
    ev.last_tool_name,
  ];
  const detail = candidates.find((value) => typeof value === "string" && value.trim())?.trim();
  return detail ? `${base}：${detail.slice(0, 120)}` : base;
}

// 只取描述本身（不带状态前缀），编队卡的行标题和成果摘要用它
function taskEventDetail(ev) {
  const candidates = [
    ev.description, ev.summary, ev.message, ev.subject,
    ev.task?.description, ev.task?.summary,
    ev.patch?.description, ev.patch?.error, ev.data?.description, ev.last_tool_name,
  ];
  return candidates.find((v) => typeof v === "string" && v.trim())?.trim().slice(0, 120) || "";
}

function taskEventIsDone(ev) {
  const status = String(ev.status ?? ev.patch?.status ?? ev.task?.status ?? "").trim().toLowerCase();
  return taskEventType(ev) === "task_notification"
    || ["completed", "complete", "success", "failed", "error", "stopped", "killed", "cancelled", "canceled"].includes(status);
}

/* ══════════════════════════════════════════════════════════
   派生子 agent 的统一呈现
   三种真实形态收敛到同一张编队卡（Codex 的串行 todo 除外）：
     A  Agent 工具派生  tool_use{name:"Agent"} + 子 agent 的 parent_tool_use_id
     B  后台异步任务     system/task_*  + task_id
     C  Codex todo_list  串行计划，走 checklist 而非编队卡
   Codex 自 2026-03 起也有 subagent（default/worker/explorer），但它们是独立的
   spawned thread，@openai/codex-sdk 到 0.146.0-alpha 的 ThreadItem union 都没
   暴露对应事件 —— 所以这里暂时接不上。等 SDK 出了事件，加个分支复用编队卡即可。
   状态存在 SquadCard 实例里，DOM 可被 assistant 事件的全量重渲染安全重建。
   ══════════════════════════════════════════════════════════ */
const SHOW_DELAY = 800;   // 更快结束的派生根本不出卡，避免闪一下就消失
const MIN_DWELL = 1200;   // 一旦出现，最少驻留这么久

const squadCards = new Map();      // squadId -> SquadCard
const squadOfTask = new Map();     // taskId/toolUseId -> squadId，供跨回合的后台任务找回原卡
/* 一个子 agent 会同时出现在两条事件流里：assistant 的 tool_use{name:"Agent"}，
   和 system 的 task_*。两条各建一项就会数成双份，所以统一归到 tool_use_id 上
   （它同时也是子 agent 自身事件的 parent_tool_use_id，L2 工具流才落得进来）。
   后续只带 task_id 的事件靠这张表找回同一项。 */
const squadTaskAlias = new Map();   // task_id -> 归一后的项 id

/* 项 id -> task_id，登记"完成信号要等 task_notification"的派生。
   后台化的派生会先立刻回一条 tool_result，但那只是启动回执，正文形如
   "Async agent launched successfully… agentId: <task_id> … working in the
   background"。照它 settle 会让还在跑的子任务立刻显示成已完成，卡随即被
   resetSquads 回收，之后的 progress 事件再另起新项 —— 数量就是这么炸的。
   识别靠正文里回带的 task_id，不靠那句英文：换措辞或换语言都不受影响，
   而同步执行的派生返回真结果时不含这个 id，照常 settle。 */
const asyncAgentItems = new Map();
let activeSquad = null;
let squadSeq = 0;

/* 派生子 agent 的工具名。SDK 现在叫 Agent（sdk-tools.d.ts 的 AgentInput），
   历史上叫 Task —— 两个都认，否则换一版 SDK 编队卡就整个失效。 */
const SUBAGENT_TOOL_NAMES = new Set(["Agent", "Task", "dispatch_to_provider"]);
const isDispatchTool = (name) => String(name || "") === "dispatch_to_provider"
  || String(name || "").endsWith("__dispatch_to_provider");
const isSubagentTool = (name) => SUBAGENT_TOOL_NAMES.has(name) || isDispatchTool(name);

const sqShortPath = (p) => String(p || "").split(/[\\/]/).pop() || "";
const sqHost = (u) => { try { return new URL(u).host; } catch { return String(u || "").slice(0, 30); } };

// 秒到分钟就换成 m:ss —— "197s" 要在脑子里除一次才知道是三分多钟
function formatElapsed(ms) {
  const s = Math.max(1, Math.round(ms / 1000));
  if (s < 60) return `${s}s`;
  const m = Math.floor(s / 60), rs = String(s % 60).padStart(2, "0");
  return m < 60 ? `${m}:${rs}` : `${Math.floor(m / 60)}:${String(m % 60).padStart(2, "0")}:${rs}`;
}

// 工具调用 → 人话，用于子 agent 的 L2 工具流
function dispatchCardLabel(input) {
  const i = input || {};
  const reason = String(i.reason || "").trim();
  const body = (reason && !reason.startsWith("用户通过"))
    ? reason
    : (i.task || reason || `交给 ${i.provider || "其他厂商"}`);
  // 续接时标出来：用户得知道对方是否记得上一轮，否则无从判断该写多少背景
  return i.resumed ? `接着上一轮 · ${body}` : body;
}

function subagentToolLabel(name, input) {
  const i = input || {};
  if (isDispatchTool(name)) return dispatchCardLabel(i);
  if (name === "Read") return `读取 ${sqShortPath(i.file_path)}`;
  if (name === "Edit" || name === "Write") return `写入 ${sqShortPath(i.file_path)}`;
  if (name === "Grep") return `检索 "${String(i.pattern ?? "").slice(0, 24)}"`;
  if (name === "Glob") return `匹配 ${i.pattern ?? ""}`;
  if (name === "Bash") return i.description || `执行 ${String(i.command ?? "").slice(0, 36)}`;
  if (name === "WebFetch") return `抓取 ${sqHost(i.url)}`;
  if (name === "WebSearch") return `搜索 "${String(i.query ?? "").slice(0, 24)}"`;
  if (isSubagentTool(name)) return i.description || "子任务";
  return name || "tool";
}

function toolResultText(content) {
  return Array.isArray(content)
    ? content.map((c) => (typeof c === "string" ? c : c?.text || "")).join(" ")
    : String(content ?? "");
}

// 和后端 DISPATCH_ALIASES 保持一致：">gemini" 要能找到 provider 为 antigravity 的账号
const DISPATCH_ALIASES = { gemini: "antigravity", agy: "antigravity", gpt: "codex", chatgpt: "codex" };

function findDispatchProvider(selector) {
  const wanted = String(selector || "").trim().toLocaleLowerCase();
  if (!wanted) return null;
  const aliased = DISPATCH_ALIASES[wanted];
  return _dispatchProviders.find((item) => String(item.id || "").toLocaleLowerCase() === wanted)
    ?? _dispatchProviders.find((item) => String(item.provider || "").toLocaleLowerCase() === wanted)
    ?? _dispatchProviders.find((item) => String(item.name || "").toLocaleLowerCase() === wanted)
    ?? (aliased ? _dispatchProviders.find((item) => String(item.provider || "").toLocaleLowerCase() === aliased) : null)
    ?? null;
}

// 生成 ">xxx" 里用的标识：优先账号名（custom 厂商的 provider 都是 "custom"，
// 只有账号名能区分），其次 provider，最后兜底用 id。候选必须不含空白（否则
// 会被 parseProviderDispatchText 的正则截断），且能反查回同一个账号才算数。
function dispatchTokenFor(profile) {
  for (const candidate of [profile.name, profile.provider, profile.id]) {
    const token = String(candidate || "").trim();
    if (!token || /\s/.test(token)) continue;
    if (findDispatchProvider(token)?.id === profile.id) return token;
  }
  return profile.id;
}

function dispatchProviderInfo(selector) {
  const profile = findDispatchProvider(selector);
  return profile ? {
    provider: profile.provider,
    providerName: profile.name,
    model: profile.model || "",
  } : {
    provider: String(selector),
    providerName: String(selector),
    model: "",
  };
}

function parseDispatchResult(content) {
  const text = toolResultText(content).trim();
  if (!text.startsWith("{")) return null;
  try {
    const parsed = JSON.parse(text);
    if (!parsed || (!parsed.provider && !parsed.providerName)) return null;
    return {
      provider: parsed.provider || "",
      providerName: parsed.providerName || parsed.provider || "",
      model: parsed.model || "",
      output: typeof parsed.output === "string" ? parsed.output : "",
      // 自动派发时前端事先不知道会不会续接（tool_use 的 input 由模型给出，
      // 不含这个字段），只能从结果里读，读到再补标到卡片上
      resumed: parsed.resumed === true,
    };
  } catch {
    return null;
  }
}

function formatDispatchOrigin(origin) {
  if (!origin) return "";
  const providerName = origin.providerName || origin.provider || "";
  return [providerName, origin.model].filter(Boolean).join(" · ");
}

// tool_result 内容 → 一句成果摘要，避免把整段 dump 塞进行尾
function subagentResultSummary(content) {
  const dispatchResult = parseDispatchResult(content);
  if (dispatchResult?.output) {
    const firstOutputLine = dispatchResult.output.trim().split("\n").find((line) => line.trim());
    if (firstOutputLine) return firstOutputLine.trim().slice(0, 40);
  }
  const first = toolResultText(content).trim().split("\n").find((l) => l.trim());
  return first ? first.trim().slice(0, 40) : "已完成";
}

/* 这条 tool_result 是"后台派生已启动"的回执，而非结果？
   判据是正文里回带了该项的 task_id —— 只有启动回执会带它。 */
function isAsyncLaunchAck(itemId, content) {
  const taskId = asyncAgentItems.get(itemId);
  return !!taskId && toolResultText(content).includes(taskId);
}

class SquadCard {
  constructor(id) {
    this.id = id;
    this.state = new Map();    // id -> {status, steps:[], result}
    this.labels = new Map();
    this.order = [];
    this.el = null;
    this.openId = null;
    this.shownAt = 0;
    this.startAt = Date.now();
    this.finishedAt = 0;
    this.mountArmed = false;
    this.block = null;
    // 这张卡属于哪一轮请求。后台子任务允许跨回合存活（见 resetSquads），
    // 所以"停止/出错时收尾卡片"必须只收本轮的，否则会把上一轮真在跑的任务
    // 误标成已停止，之后真实进度到达时又因状态已终结被忽略，UI 永久失真。
    this.ownerRequestId = typeof activeRequestId !== "undefined" ? activeRequestId : null;
  }

  has(id) { return this.state.has(id); }

  get counts() {
    let done = 0, live = 0, fail = 0;
    this.state.forEach((s) => {
      if (s.status === "done") done++;
      else if (s.status === "failed") fail++;
      else live++;
    });
    return { done, live, fail, total: this.order.length };
  }

  spawn(id, label, origin = null) {
    if (this.state.has(id)) return;
    this.state.set(id, { status: "running", steps: [], result: null, origin, startAt: Date.now(), endAt: 0 });
    this.labels.set(id, label);
    this.order.push(id);
    squadOfTask.set(id, this.id);
    if (this.el) this.addRow(id, this.order.length - 1);
    // 跨厂商归属是产品语义，不应被“短任务不闪卡”的延迟规则吞掉；
    // 即使很快完成，也要让用户一眼看到这段工作由谁执行。
    else if (origin) this.mount();
    else this.armMount();
    this.refresh();
    this.syncBlock();
    updateBackgroundActivity();
  }

  armMount() {
    if (this.mountArmed) return;
    this.mountArmed = true;
    setTimeout(() => {
      if (this.counts.live > 0 && !this.el) this.mount();
    }, SHOW_DELAY);
  }

  step(id, text) {
    const s = this.state.get(id);
    if (!s || s.status === "done" || s.status === "failed") return;
    s.steps.push(text);
    if (this.openId === id) this.paintDetail(id);
    this.syncBlock();
    this.syncChip();
  }

  /* 子任务的进度由活动条报，gen chip 让位。同一件事在两处喊，眼睛不知道看哪个 ——
     而且 gen chip 长在消息流里，会随消息滚走，活动条不会。 */
  syncChip() {
    if (this.counts.live > 0) updateGenChip("");
  }

  settle(id, status, result, origin = null) {
    const s = this.state.get(id);
    if (!s || s.status === "done" || s.status === "failed") return;
    s.status = status;
    s.result = result;
    if (origin) s.origin = origin;
    // 自动派发时是否续接只能从结果里得知，这时才把标记补到标题上。
    // 标签存在 this.labels 而不是状态对象里，改完要 paintRow 才会显示。
    if (origin?.resumed) {
      const label = this.labels.get(id);
      if (label && !label.startsWith("接着上一轮")) {
        this.labels.set(id, `接着上一轮 · ${label}`);
      }
    }
    s.endAt = Date.now();
    this.paintRow(id);
    this.refresh();
    this.syncBlock();
    this.syncChip();
    updateBackgroundActivity();
    if (this.counts.live === 0) this.join();
  }

  /* 把自己登记成一个 assistantBlock：既支撑 assistant 事件的全量重渲染，
     也让快照进入历史，刷新后仍能把卡片还原出来 */
  ensureBlock() {
    if (this.block) return;
    this.block = { type: "squad", squadId: this.id, snapshot: this.snapshot() };
    assistantBlocks.push(this.block);
  }

  // 用纯数组存，保证能 JSON 序列化进历史
  snapshot() {
    return {
      order: [...this.order],
      labels: [...this.labels],
      state: [...this.state].map(([k, v]) => [k, { status: v.status, result: v.result, origin: v.origin ?? null, steps: [...v.steps], startAt: v.startAt, endAt: v.endAt }]),
      startAt: this.startAt,
      finishedAt: this.finishedAt,
    };
  }

  syncBlock() {
    if (this.block) this.block.snapshot = this.snapshot();
  }

  static fromSnapshot(id, snap) {
    const card = new SquadCard(id);
    card.order = [...(snap.order ?? [])];
    card.labels = new Map(snap.labels ?? []);
    card.state = new Map((snap.state ?? []).map(([k, v]) => [k, {
      status: v.status, result: v.result, origin: v.origin ?? null, steps: [...(v.steps ?? [])],
      startAt: v.startAt ?? snap.startAt ?? 0, endAt: v.endAt ?? 0,
    }]));
    card.startAt = snap.startAt ?? Date.now();
    card.finishedAt = snap.finishedAt ?? 0;
    squadCards.set(id, card);
    return card;
  }

  mount() {
    if (this.el) return;
    this.ensureBlock();
    if (!assistantEl) { removeTyping(); assistantEl = addMessage("assistant", ""); }
    // typing 一走，进行中指示器必须立刻接上，否则会出现一段
    // "正在跑、但消息流里看不出在跑"的空窗
    if (!genChipEl && isGenerating) showGenChip("");
    const body = assistantEl.querySelector(".msg-body");
    body.appendChild(this.render());
    reanchorGenChip();
    scrollBottom();
  }

  /* 从当前状态重建整张卡 —— 全量重渲染时被 appendAssistantBlock 调用 */
  render() {
    const card = document.createElement("div");
    card.className = "squad";
    card.dataset.squadId = this.id;
    card.innerHTML = `
      <div class="sq-head">
        <span class="sq-title">分头处理中</span>
        <span class="sq-count"></span>
        <span class="sq-spacer"></span>
        <button class="sq-stopall">全部停止</button>
        <svg class="sq-chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 6.5 8 10.5l4-4"/></svg>
      </div>
      <div class="sq-body"><div class="sq-clip"><div class="sq-rows"><i class="sq-rail"></i></div></div></div>
      <div class="sq-summary"><span class="jd"></span><span class="sq-sumtxt"></span><span class="sq-re">展开</span></div>`;
    this.el = card;
    this.shownAt = this.shownAt || Date.now();

    card.querySelector(".sq-head").onclick = (e) => {
      if (e.target.closest(".sq-stopall")) return;
      card.classList.toggle("folded");
    };
    card.querySelector(".sq-stopall").onclick = () => this.stopAll();
    // 整行可点：合流后只剩一行 11px 灰字，把命中区限制在"展开"两个字上太苛刻
    card.querySelector(".sq-summary").onclick = () => this.unfold();

    this.order.forEach((id, i) => this.addRow(id, i));
    this.refresh();

    const allSettled = this.counts.live === 0 && this.order.length > 0;
    requestAnimationFrame(() => {
      card.querySelector(".sq-rail").classList.add("grown");
      card.querySelectorAll(".sq-conn").forEach((c, i) => {
        setTimeout(() => c.classList.add("grown"), allSettled ? 0 : 100 + i * 55);
      });
    });
    // 重建时若早已合流，直接恢复到摘要态，不重放动画
    if (allSettled) { card.classList.add("done"); this.paintSummary(); }
    // 此刻 card 还没被 appendChild，isConnected 仍是 false —— 直接刷新会被
    // liveSquadCards 的死链剔除误伤。挪到调用方插完 DOM 之后。
    queueMicrotask(updateBackgroundActivity);
    return card;
  }

  /* 从摘要态还原成完整卡。抽屉跳转和点摘要行都走这里 */
  unfold() {
    if (!this.el) return;
    this.el.classList.remove("done", "folded");
    const head = this.el.querySelector(".sq-head");
    if (head) head.style.display = "";
    this.el.querySelector(".sq-rail")?.classList.remove("joined");
    this.el.querySelectorAll(".sq-conn").forEach((c) => c.classList.remove("joined"));
    this.refresh();
  }

  addRow(id, i) {
    const rows = this.el.querySelector(".sq-rows");
    const row = document.createElement("div");
    row.className = "sq-row";
    row.dataset.s = this.state.get(id)?.status || "queued";
    row.dataset.id = id;
    row.style.animationDelay = (i * 55) + "ms";
    row.innerHTML = `
      <i class="sq-conn"></i>
      <span class="sq-dot"></span>
      <span class="sq-label"></span>
      <span class="sq-origin"></span>
      <span class="sq-meta num"></span>
      <button class="sq-stop">停止</button>`;
    row.querySelector(".sq-label").textContent = this.labels.get(id) || id;

    const det = document.createElement("div");
    det.className = "sq-detail";
    det.dataset.for = id;
    det.innerHTML = `<div><div class="sq-detail-in"></div></div>`;

    row.onclick = (e) => {
      if (e.target.closest(".sq-stop")) return;
      this.toggleDetail(id);
    };
    row.querySelector(".sq-stop").onclick = () => this.stopOne(id);

    rows.appendChild(row);
    rows.appendChild(det);
    this.paintRow(id);
    if (this.el.querySelector(".sq-rail")?.classList.contains("grown")) {
      requestAnimationFrame(() => row.querySelector(".sq-conn").classList.add("grown"));
    }
    if (this.openId === id) { this.paintDetail(id); det.classList.add("open"); }
  }

  paintRow(id) {
    const row = this.el?.querySelector(`.sq-row[data-id="${cssEscapeValue(id)}"]`);
    const s = this.state.get(id);
    if (!row || !s) return;
    row.dataset.s = s.status;
    const origin = row.querySelector(".sq-origin");
    const originText = formatDispatchOrigin(s.origin);
    origin.textContent = originText;
    origin.title = originText;
    origin.classList.toggle("visible", !!originText);
    const meta = row.querySelector(".sq-meta");
    if (s.status === "done" || s.status === "failed") {
      meta.textContent = s.result || "";
      meta.classList.toggle("num", !s.result);
    } else {
      meta.textContent = "";
    }
  }

  toggleDetail(id) {
    const opening = this.openId !== id;
    this.el.querySelectorAll(".sq-detail").forEach((d) => d.classList.remove("open"));
    this.openId = opening ? id : null;
    if (opening) {
      this.paintDetail(id);
      this.el.querySelector(`.sq-detail[data-for="${cssEscapeValue(id)}"]`)?.classList.add("open");
    }
  }

  paintDetail(id) {
    const box = this.el?.querySelector(`.sq-detail[data-for="${cssEscapeValue(id)}"] .sq-detail-in`);
    const s = this.state.get(id);
    if (!box || !s) return;
    box.innerHTML = "";
    s.steps.forEach((txt, i) => {
      const e = document.createElement("span");
      e.className = "st" + (i === s.steps.length - 1 && s.status === "running" ? " now" : "");
      e.textContent = txt;
      box.appendChild(e);
    });
    if (!s.steps.length) {
      const e = document.createElement("span");
      e.className = "st";
      e.textContent = "等待子任务的第一个动作…";
      box.appendChild(e);
    }
    if (s.result) {
      const r = document.createElement("span");
      r.className = "rs";
      r.textContent = s.result;
      box.appendChild(r);
    }
  }

  refresh() {
    if (!this.el) return;
    const c = this.counts;
    this.el.querySelector(".sq-count").textContent =
      c.done + c.fail > 0 ? `${c.done + c.fail}/${c.total}` : `${c.total} 项`;
    // 从抽屉跳回来时卡会从摘要态还原，"分头处理中" 配 3/3 是自相矛盾的
    const title = this.el.querySelector(".sq-title");
    if (title) {
      // 跨厂商时直接报出是谁在干活——"厂商"是内部说法，用户只关心哪个模型接了活
      const names = [...new Set(
        this.order
          .map((id) => this.state.get(id)?.origin)
          .filter(Boolean)
          .map((o) => o.providerName || o.provider)
          .filter(Boolean)
      )];
      if (names.length > 0) {
        const verb = c.live > 0 ? "处理中" : "已处理";
        // 列举名字时中英文之间留空格，"…个模型"后面直接接动词，不留空
        title.textContent = names.length <= 2
          ? `${names.join("、")} ${verb}`
          : `${names[0]} 等 ${names.length} 个模型${verb}`;
      } else {
        title.textContent = c.live > 0 ? "分头处理中" : "分头处理";
      }
    }
    const stopAll = this.el.querySelector(".sq-stopall");
    if (stopAll) stopAll.hidden = c.live === 0;
  }

  stopOne(id) {
    const label = this.labels.get(id) || id;
    this.settle(id, "failed", "已跳过");
    const left = this.counts.live;
    // "跳过"只改前端显示，服务端那个子任务还在跑——多项并行时这是对的，剩下的
    // 确实还要继续。但如果这是最后一项，整轮就没有活着的任务了，此时必须真的
    // 停掉那轮请求：否则服务端一直占着 activeForegroundRequestId，用户之后发的
    // 消息全被排队，界面上却显示"已跳过"，看不出哪里卡住。
    if (left === 0 && this.isCurrentTurn) {
      sendStopRequest();
      updateGenChip(`已停止「${label}」`);
      return;
    }
    // 说清楚"跳过"的真实含义：这里停不掉单个子进程，服务端没有按子任务
    // 取消的接口。不写明的话，用户会以为点了就不花钱了。
    updateGenChip(left > 0
      ? `已从列表移除「${label}」，它仍在后台跑完；其余 ${left} 项继续`
      : `已从列表移除「${label}」`);
  }

  /** 这张卡是不是当前这一轮的。不是的话，停止只能改显示，停不掉服务端 */
  get isCurrentTurn() {
    return Boolean(this.ownerRequestId) && this.ownerRequestId === activeRequestId;
  }

  stopAll() {
    // 必须走 sendStopRequest()：服务端认的是 msg.stop，而且要带 userMessageId
    // 才能匹配上当前请求。以前这里发的是 { type: "stop" }——服务端整条忽略，于是
    // 卡片显示"已停止"而那轮请求还占着 activeForegroundRequestId，之后发的消息
    // 全被排队卡住，只能重启应用。
    //
    // 但只有本轮的卡才能这么停：sendStopRequest 停的是 activeRequestId，对一张
    // 上一轮遗留的后台卡按停止，会把当前正在跑的新请求给停了——按错人。
    if (!this.isCurrentTurn) {
      updateGenChip("这批子任务属于更早的一轮，停不掉了；它们跑完会自己收尾");
      return;
    }
    this.order.forEach((id) => {
      const s = this.state.get(id);
      if (s && s.status !== "done" && s.status !== "failed") this.settle(id, "failed", "已停止");
    });
    sendStopRequest();
  }

  /* 摘要行带上"做了什么"。只报数量的话，这行灰字跟系统日志长得一模一样，
     在滚回去找"刚才那个子任务查到了啥"时根本认不出来。 */
  summaryTitle() {
    const names = this.order.map((id) => this.labels.get(id)).filter(Boolean);
    if (!names.length) return `${this.order.length} 项子任务`;
    let text = names.join("、");
    if (text.length > 22) {
      // 逐个丢弃到放得下，剩下的折成"+N"，避免从中间截断把词切碎
      let kept = names.length;
      while (kept > 1 && names.slice(0, kept).join("、").length > 18) kept--;
      text = names.slice(0, kept).join("、");
      if (text.length > 20) text = text.slice(0, 19) + "…";
      if (kept < names.length) text += ` +${names.length - kept}`;
    }
    return text;
  }

  paintSummary() {
    if (!this.el) return;
    const c = this.counts;
    // 用合流时刻定格，否则历史回放会显示"已完成 3 项 · 84000s"
    this.finishedAt = this.finishedAt || Date.now();
    const took = formatElapsed(this.finishedAt - this.startAt);
    this.el.querySelector(".sq-sumtxt").textContent = c.fail
      ? `${this.summaryTitle()} · ${c.fail} 项未成功 · ${took}`
      : `${this.summaryTitle()} · ${took}`;
  }

  /* 合流：分支收回 → rail 并线 → 整卡塌成一行摘要 */
  join() {
    if (!this.el || this.el.classList.contains("done")) return;
    const wait = Math.max(0, MIN_DWELL - (Date.now() - this.shownAt));
    setTimeout(() => {
      if (!this.el) return;
      this.el.querySelectorAll(".sq-conn").forEach((c, i) => setTimeout(() => c.classList.add("joined"), i * 45));
      setTimeout(() => this.el?.querySelector(".sq-rail")?.classList.add("joined"), 120);
      setTimeout(() => {
        if (!this.el) return;
        this.el.classList.add("done");
        this.paintSummary();
        this.syncBlock();   // 把定格的耗时一起写进历史快照
        scrollBottom();
      }, 420);
    }, wait);
  }
}

/* 按项 id 找到拥有它的那张卡。不能只看 activeSquad —— 回合结束时 resetSquads
   会把它置空，而后台任务的事件正是在那之后才回来的。 */
/**
 * 这一轮结束了，把还挂着"进行中"的子任务卡片收掉。
 *
 * cleanupRunningTools() 只管普通工具行，碰不到编队卡。停止一轮跨厂商派发时，
 * 服务端因为回合号已经变了不会再补发 tool_result，卡片就永远停在"进行中"——
 * 而底下的子进程其实早就被杀干净了。UI 说谎比 UI 难看严重得多。
 */
function settleRunningSquadTasks(reason = "已停止", requestId = null) {
  for (const card of squadCards.values()) {
    // 只收本轮的卡。跨回合存活的后台任务不归这次停止管——它们还在真跑，
    // 标成"已停止"之后真实进度到达时会被 settle 的终态判断吞掉，UI 就再也
    // 追不回来了。owner 为空的是早于本机制创建的卡，保守起见也放过。
    if (!card.ownerRequestId || (requestId && card.ownerRequestId !== requestId)) continue;
    for (const id of card.order) {
      const s = card.state.get(id);
      if (s && s.status !== "done" && s.status !== "failed") {
        card.settle(id, "failed", reason);
      }
    }
  }
}

function squadOwning(itemId) {
  const card = squadCards.get(squadOfTask.get(itemId));
  return card?.has(itemId) ? card : null;
}

// 跨厂商派发的步骤归位：MCP 工具内部没有自己的 tool_use_id，只能靠
// provider+task 前缀反查。与 server.js 的 dispatchStepKey 必须保持一致。
//
// key 只取任务前 100 字，同一厂商派两个开头相同的长任务就会撞——后登记的会把
// 先前那条覆盖掉，于是前一张卡片从此收不到步骤。所以按 key 存一个队列，新的
// 排在后面，取的时候优先给还没结束的那张卡。
// 同时限制总量：一个长会话里派几百次，这张表会一直涨。
const dispatchKeyToTaskId = new Map();
const DISPATCH_KEY_LIMIT = 64;

function dispatchStepKeyOf(input) {
  return `${String(input?.provider || "").trim()}|${String(input?.task || "").trim().slice(0, 100)}`;
}

function registerDispatchKey(input, toolUseId) {
  const key = dispatchStepKeyOf(input);
  if (key.trim() === "|") return;
  // 先把已经不存在的 id 清掉：容量限制只管 key 的数量，同一个 key 下的数组
  // 只追加不删除的话，反复派同样开头的任务会让它无限长
  const ids = (dispatchKeyToTaskId.get(key) || []).filter((old) => squadOfTask.has(old));
  if (!ids.includes(toolUseId)) ids.push(toolUseId);
  // 重新 set 让它排到末尾，下面按插入序淘汰才是真正的 LRU
  dispatchKeyToTaskId.delete(key);
  dispatchKeyToTaskId.set(key, ids);
  while (dispatchKeyToTaskId.size > DISPATCH_KEY_LIMIT) {
    const oldest = dispatchKeyToTaskId.keys().next().value;
    if (oldest === undefined) break;
    dispatchKeyToTaskId.delete(oldest);
  }
}

/** 按 key 找该收这条步骤的卡片：优先还在跑的那张，都结束了就给最后一张 */
function taskIdForDispatchKey(key) {
  const ids = dispatchKeyToTaskId.get(key || "");
  if (!ids?.length) return null;
  for (const id of ids) {
    const card = squadOfTask.has(id) ? squadCards.get(squadOfTask.get(id)) : null;
    const status = card?.state.get(id)?.status;
    if (status && status !== "done" && status !== "failed") return id;
  }
  return ids[ids.length - 1];
}

function currentSquad(create) {
  if (activeSquad && squadCards.has(activeSquad)) return squadCards.get(activeSquad);
  if (!create) return null;
  const id = `sq_${++squadSeq}`;
  const card = new SquadCard(id);
  squadCards.set(id, card);
  activeSquad = id;
  return card;
}

/* 回合结束时的清理。后台任务（system/task_*）会跨回合继续跑 —— 主 agent 的
   前台轮结束不代表它们结束，所以还在运行的卡必须留着，否则它后续的
   task_progress / task_notification 会另起一张孤卡。 */
function resetSquads() {
  for (const [id, card] of [...squadCards]) {
    if (card.counts.live > 0) continue;          // 仍在后台跑，留着
    squadCards.delete(id);
    for (const [taskId, sid] of [...squadOfTask]) {
      if (sid === id) squadOfTask.delete(taskId);
    }
  }
  // 别名指向的项没了就一起收掉，否则跨回合的 task_id 会归到一个不存在的项上
  for (const [taskId, itemId] of [...squadTaskAlias]) {
    if (!squadOfTask.has(itemId)) squadTaskAlias.delete(taskId);
  }
  for (const id of [...asyncAgentItems.keys()]) {
    if (!squadOfTask.has(id)) asyncAgentItems.delete(id);
  }
  activeSquad = null;   // 下一轮的前台派生另起一张，不混进上一轮
  todoListEl = null;
}

/* ── 子任务活动条 ──
   只要还有子 agent 在跑就常驻，不区分前台/后台 —— 恰恰是生成过程中最需要它。
   （旧版在 isGenerating 时把自己藏起来，让位给 gen chip，结果是最该看见的
   那段时间反而什么都没有，而 gen chip 会随消息流滚走。） */
let bgActivityEl = null;
let bgActivityHideTimer = null;
let bgActivityOpen = false;   // 展开状态跨轮保持：手动开过就说明你想盯着

// 惰性获取并绑定：setGenerating 可能在脚本执行期就被调用，顶层 const 会踩 TDZ
function ensureBgActivityEl() {
  if (bgActivityEl) return bgActivityEl;
  const el = document.getElementById("bg-activity");
  if (!el) return null;
  bgActivityEl = el;
  el.querySelector(".bga-head").onclick = () => {
    bgActivityOpen = !bgActivityOpen;
    el.classList.toggle("open", bgActivityOpen);
    if (bgActivityOpen) renderBgActivityList();
    else syncBgActivityTicker();   // 收起就别再空转
  };
  return el;
}

function liveBackgroundTasks() {
  let live = 0;
  squadCards.forEach((card) => { live += card.counts.live; });
  return live;
}

function updateBackgroundActivity() {
  const el = ensureBgActivityEl();
  if (!el) return;
  const live = liveBackgroundTasks();
  const tasks = allSubagentTasks();
  const total = tasks.length;

  if (live > 0) {
    clearTimeout(bgActivityHideTimer);
    el.classList.remove("done");
    el.querySelector(".bga-text").textContent =
      total > live ? `${live} 个子任务进行中 · 共 ${total} 项` : `${live} 个子任务进行中`;
    el.hidden = false;
    el.classList.toggle("open", bgActivityOpen);
    if (bgActivityOpen) renderBgActivityList();
    return;
  }

  // 刚从"有任务"跌到 0：报一次结果，留几秒够你点开看，然后自己消失
  if (!el.hidden && !el.classList.contains("done")) {
    const fail = tasks.filter((t) => t.s.status === "failed").length;
    el.classList.add("done");
    el.classList.toggle("has-fail", fail > 0);
    el.querySelector(".bga-text").textContent = !total ? "子任务已结束"
      : fail ? `${total - fail} 个完成 · ${fail} 个未成功`
        : `${total} 个子任务已全部完成`;
    if (bgActivityOpen) renderBgActivityList();
    clearTimeout(bgActivityHideTimer);
    bgActivityHideTimer = setTimeout(() => {
      el.hidden = true;
      el.classList.remove("open");
      bgActivityOpen = false;
      syncBgActivityTicker();
    }, 8000);
  }
}

/* ══════════════════════════════════════════════════════════
   活动条的任务索引
   编队卡活在消息流里，后面来两条消息就把它顶出视口，而子 agent 常常还在跑，
   后台任务甚至跨回合。活动条贴在输入框上方，负责回答"现在有几个在干活"。
   ══════════════════════════════════════════════════════════ */
/* 只认 squadCards 里的卡 —— 那正是"这一轮还相关的"：回合结束时 resetSquads
   会清掉已收尾的卡，只留还在后台跑的。若改成累计整场会话，条上的数字会把前
   几轮早已结束的子任务一起算进来，跟你这次派了几个对不上。
   同时滤掉 DOM 已失联的（会话切换会清空 #messages），免得点了跳不过去。 */
function liveSquadCards() {
  const out = [];
  squadCards.forEach((card) => { if (card.el?.isConnected) out.push(card); });
  return out;
}

// scrollIntoView 会连带滚坏外层容器，手动算
function scrollElementIntoMessages(target) {
  const box = document.getElementById("messages");
  if (!box || !target) return;
  const boxRect = box.getBoundingClientRect();
  const tRect = target.getBoundingClientRect();
  box.scrollTop += (tRect.top - boxRect.top) - Math.max(0, (box.clientHeight - tRect.height) / 2);
}

function flashElement(el, radius = 3) {
  el?.animate(
    [{ boxShadow: `0 0 0 ${radius}px var(--accent-ring)` }, { boxShadow: "0 0 0 0 transparent" }],
    { duration: 700, easing: "cubic-bezier(0.32, 0.72, 0, 1)" },
  );
}

/* 跳回某张卡（可带具体子任务：顺便展开它的工具流并高亮那一行） */
function revealSquadCard(card, taskId) {
  if (!card?.el?.isConnected) return;
  card.unfold();
  if (taskId && card.state.has(taskId) && card.openId !== taskId) card.toggleDetail(taskId);
  const row = taskId
    ? card.el.querySelector(`.sq-row[data-id="${cssEscapeValue(taskId)}"]`)
    : null;
  scrollElementIntoMessages(row || card.el);
  flashElement(row || card.el, row ? 2 : 3);
}

/* 当前所有子任务，按"未完成在前、刚结束的紧随其后"排。
   刚完成的排在已结束一侧的最前 —— 那是最可能被回头看一眼的 */
function allSubagentTasks() {
  const running = [], settled = [];
  liveSquadCards().forEach((card) => {
    card.order.forEach((id) => {
      const s = card.state.get(id);
      if (!s) return;
      (s.status === "done" || s.status === "failed" ? settled : running)
        .push({ card, id, s, label: card.labels.get(id) || id });
    });
  });
  running.sort((a, b) => (a.s.startAt ?? 0) - (b.s.startAt ?? 0));
  settled.sort((a, b) => (b.s.endAt ?? 0) - (a.s.endAt ?? 0));
  return running.concat(settled);
}

function renderBgActivityList() {
  const listEl = bgActivityEl?.querySelector(".bga-list");
  if (!listEl) return;
  const now = Date.now();
  listEl.innerHTML = "";
  allSubagentTasks().forEach(({ card, id, s, label }) => {
    const item = document.createElement("div");
    item.className = "bga-item";
    item.dataset.s = s.status;
    if (s.startAt) item.dataset.start = String(s.startAt);
    item.innerHTML = `<span class="bga-idot"></span><span class="bga-ilabel"></span><span class="bga-iorigin"></span><span class="bga-imeta"></span>`;
    item.querySelector(".bga-ilabel").textContent = label;
    item.querySelector(".bga-iorigin").textContent = formatDispatchOrigin(s.origin);
    // 跑着的显示走动的秒数：静态的"运行中"分不出刚起步和卡了三分钟
    item.querySelector(".bga-imeta").textContent =
      s.status === "running" ? (s.startAt ? formatElapsed(now - s.startAt) : "运行中")
        : s.status === "failed" ? "未完成"
          : s.endAt && s.startAt ? formatElapsed(s.endAt - s.startAt) : "";
    item.title = label;
    // 点一项 = 跳到它所在的卡并就地展开它的工具流，比自己翻回去快得多
    item.onclick = () => revealSquadCard(card, id);
    listEl.appendChild(item);
  });
  syncBgActivityTicker();
}

/* 秒表只在"展开着 + 确实有东西在跑"时走，收起或跑完立刻停 */
let bgActivityTicker = null;

function syncBgActivityTicker() {
  const needed = bgActivityOpen && bgActivityEl && !bgActivityEl.hidden
    && !!bgActivityEl.querySelector('.bga-item[data-s="running"][data-start]');
  if (needed && !bgActivityTicker) {
    bgActivityTicker = setInterval(tickBgActivityElapsed, 1000);
  } else if (!needed && bgActivityTicker) {
    clearInterval(bgActivityTicker);
    bgActivityTicker = null;
  }
}

// 只改文本节点，不重建 DOM —— 每秒重建会打断 hover 和点击
function tickBgActivityElapsed() {
  const rows = bgActivityEl?.querySelectorAll('.bga-item[data-s="running"][data-start]');
  if (!rows?.length) return syncBgActivityTicker();
  const now = Date.now();
  rows.forEach((el) => {
    el.querySelector(".bga-imeta").textContent = formatElapsed(now - Number(el.dataset.start));
  });
}

/* ── Codex 的串行 checklist ── */
let todoListEl = null;
function renderTodoList(items) {
  if (!Array.isArray(items) || !items.length) return;
  if (!assistantEl) { removeTyping(); assistantEl = addMessage("assistant", ""); }
  if (!genChipEl && isGenerating) showGenChip("");
  const body = assistantEl.querySelector(".msg-body");
  if (!todoListEl || !body.contains(todoListEl)) {
    const wrap = document.createElement("div");
    wrap.className = "todo";
    wrap.innerHTML = `<div class="todo-h">执行计划</div><div class="todo-body"></div>`;
    body.appendChild(wrap);
    todoListEl = wrap.querySelector(".todo-body");
    reanchorGenChip();
  }
  todoListEl.innerHTML = "";
  const nextIdx = items.findIndex((i) => !i.completed);
  items.forEach((it, i) => {
    const row = document.createElement("div");
    row.className = "todo-i" + (it.completed ? " on" : (i === nextIdx ? " now" : ""));
    row.innerHTML = `<span class="todo-b"></span><span class="todo-t"></span>`;
    row.querySelector(".todo-t").textContent = it.text ?? "";
    todoListEl.appendChild(row);
  });
  const doneN = items.filter((i) => i.completed).length;
  updateGenChip(doneN < items.length ? `按计划执行 · 第 ${doneN + 1}/${items.length} 步` : "");
  scrollBottom();
}

/* ══════════════════════════════════════════════════════════
   reducer：真实事件 → 编队状态
   返回 true 表示已被子 agent UI 消费，主对话流不再渲染这条
   ══════════════════════════════════════════════════════════ */
function subagentIngest(ev) {
  // ── A · 子 agent 自己的事件：靠 parent_tool_use_id 归位。
  //    默认 forwardSubagentText:false 时这里只有 tool_use/tool_result，
  //    已经够喂 L2；开了才有 text/thinking。无论如何都不该漏进主流。
  if (ev.parent_tool_use_id) {
    const card = squadOwning(ev.parent_tool_use_id);
    if (card) {
      for (const b of ev.message?.content ?? []) {
        if (b.type === "tool_use" || b.type === "server_tool_use" || b.type === "mcp_tool_use") {
          card.step(ev.parent_tool_use_id, subagentToolLabel(b.name, b.input));
        } else if (b.type === "text" && b.text?.trim()) {
          card.step(ev.parent_tool_use_id, b.text.trim().slice(0, 52));
        }
      }
    }
    return true;
  }

  // ── A2 · 主 agent 发起 Agent 工具派生
  if (ev.type === "assistant") {
    const tasks = (ev.message?.content ?? []).filter((b) => b.type === "tool_use" && isSubagentTool(b.name));
    if (tasks.length) {
      const card = currentSquad(true);
      tasks.forEach((b) => {
        card.spawn(
          b.id,
          isDispatchTool(b.name)
            ? dispatchCardLabel(b.input)
            : (b.input?.description || b.input?.subagent_type || "子任务"),
          isDispatchTool(b.name) ? dispatchProviderInfo(b.input?.provider) : null,
        );
        // 记下 key→id，好让后续 dispatch_step 找得到这张卡
        if (isDispatchTool(b.name)) registerDispatchKey(b.input, b.id);
      });
      return false;   // 这条 assistant 消息还有别的内容，交回主流继续渲染
    }
  }

  // ── A3 · 派生返回 → 该分支合流
  if (ev.type === "user") {
    let hit = false;
    for (const b of ev.message?.content ?? []) {
      if (b.type !== "tool_result") continue;
      const card = squadOwning(b.tool_use_id);
      if (!card) continue;
      hit = true;
      if (isAsyncLaunchAck(b.tool_use_id, b.content)) continue;   // 只是启动回执
      card.settle(
        b.tool_use_id,
        b.is_error ? "failed" : "done",
        subagentResultSummary(b.content),
        parseDispatchResult(b.content),
      );
    }
    if (hit) return true;
  }

  // ── B · 后台异步任务。可能跨回合回来，先按 taskId 找回它原来那张卡
  if (ev.type === "system" && TASK_EVENT_TYPES.has(ev.subtype)) {
    const taskId = taskEventId(ev);
    /* 归一到 tool_use_id：A2 已经用它建过项了（或稍后会用它来建），
       而子 agent 自身事件的 parent_tool_use_id 也是它 —— 一个键贯穿三条流。 */
    const toolUseId = ev.tool_use_id ?? ev.toolUseID ?? null;
    if (toolUseId) squadTaskAlias.set(taskId, toolUseId);
    const id = squadTaskAlias.get(taskId) ?? taskId;
    const card = squadOwning(id) ?? currentSquad(true);
    const status = String(ev.status ?? ev.patch?.status ?? ev.task?.status ?? "").trim().toLowerCase();
    const desc = taskEventDetail(ev);
    if (!card.has(id)) card.spawn(id, desc || "后台任务");
    if (taskEventIsDone(ev)) {
      asyncAgentItems.delete(id);
      card.settle(id, (status === "failed" || status === "error") ? "failed" : "done", desc || "已完成");
    } else {
      asyncAgentItems.set(id, taskId);   // 记下 task_id，供识别启动回执
      if (desc) card.step(id, desc);
    }
    return true;
  }

  // ── C · Codex todo_list：这是当前 thread 的串行计划，不是并行派生，
  //        所以走 checklist 不套编队卡。Codex 真正的 subagent 走独立 thread，
  //        SDK 目前不透传，与这里无关。
  if (ev.type === "tool_progress" && ev.itemType === "todo_list") {
    renderTodoList(ev.raw?.items ?? []);
    return true;
  }

  return false;
}

// ── Event handling ────────────────────────────────────────
function handleEvent(ev) {
  lastWsEventAt = Date.now();

  // Server heartbeat (every 30s) — only used to keep lastWsEventAt fresh so the
  // dead-socket detector below never fires on a healthy connection.
  if (ev.type === "ping") return;

  if (ev.type === "sessions_snapshot") { applySessionsSnapshot(ev); return; }

  /* 多开：别的对话的事件不能渲染进当前消息流——那正是「串话」。
     它们只用来更新会话列表上的状态点和未读标记。
     没带 conversationId 的是连接级事件（init、快照之类），不受此限。 */
  if (ev.conversationId && currentConvId && ev.conversationId !== currentConvId) {
    noteBackgroundEvent(ev);
    return;
  }

  if (handleSteeringEvent(ev)) return;

  // 跨厂商子 agent 的工具动作：它跑在独立进程里，事件不会带 parent_tool_use_id
  // 冒泡上来，只能由服务端单独转发，这里补进对应卡片的步骤流。
  if (ev.type === "dispatch_step") {
    const taskId = ev.toolUseId || taskIdForDispatchKey(ev.key);
    if (taskId) {
      const card = squadOwning(taskId);
      if (card) card.step(taskId, subagentToolLabel(ev.name, ev.input));
    }
    return;
  }

  if (ev.type === "reset_complete") {
    resetRequested = false;
    pendingRequestDraft = null;
    activeRequestId = null;
    clearTimeout(requestRetryTimer);
    requestRetryTimer = null;
    clearTimeout(errorCompletionTimer);
    errorCompletionTimer = null;
    clearAskUserQuestion();
    resetAssistantState();
    setGenerating(false);
    removeTyping();
    messagesEl.innerHTML = "";
    messageLog = [];
    currentConvId = genId();      // 同上：重置后的空对话仍然要有身份
    currentSessionId = null;
    steeringQueue.length = 0;
    steeringRemovalPending.clear();
    steeringEditingId = null;
    renderSteeringTray();
    return;
  }

  // Reset is a generation boundary. Events already buffered by the old socket
  // must not be allowed to repopulate the freshly cleared conversation.
  if (resetRequested) return;

  if (ev.type === "request_ack") {
    if (ev.state === "running") materializeStartedSteering(ev);
    if (pendingRequestDraft?.userMessageId === ev.userMessageId) {
      pendingRequestDraft = null;
      clearTimeout(requestRetryTimer);
      requestRetryTimer = null;
    }
    if (ev.state === "queued" || ev.state === "running") {
      activeRequestId = ev.userMessageId || activeRequestId;
      setGenerating(true);
      if (!document.getElementById("typing")) addTyping();
      if (stopRequested && stopResendPending) sendStopRequest();
    } else if (activeRequestId && ev.userMessageId === activeRequestId) {
      finishGenerationAndContinue(ev.userMessageId);
    }
    flushLocalSteering();
    return;
  }

  if (ev.type === "request_started") {
    materializeStartedSteering(ev);
    if (pendingRequestDraft?.userMessageId === ev.userMessageId) {
      pendingRequestDraft = null;
      clearTimeout(requestRetryTimer);
      requestRetryTimer = null;
    }
    activeRequestId = ev.userMessageId || activeRequestId;
    setGenerating(true);
    if (!document.getElementById("typing")) addTyping();
    flushLocalSteering();
    return;
  }

  if (ev.type === "request_retry") {
    if (pendingRequestDraft?.userMessageId !== ev.userMessageId) return;
    updateTypingStatus("AI 服务正在安全重启，消息会自动重试...");
    if (stopRequested) stopResendPending = true;
    clearTimeout(requestRetryTimer);
    requestRetryTimer = setTimeout(() => {
      requestRetryTimer = null;
      if (!pendingRequestDraft || !resendPendingRequest()) return;
      if (stopRequested) {
        stopResendPending = true;
        sendStopRequest();
      }
    }, Math.max(100, Number(ev.retryAfterMs) || 1000));
    return;
  }

  // Reconnected while the server still has a run in flight (or a finished run
  // whose events we missed). Restore the generating UI; buffered events replay
  // immediately after this message.
  if (ev.type === "run_attached") {
    if (ev.userMessageId) activeRequestId = ev.userMessageId;
    if (pendingRequestDraft) {
      setGenerating(true);
      if (!document.getElementById("typing")) addTyping();
      if (stopRequested) sendStopRequest();
      return;
    }
    if (ev.running) {
      setGenerating(true);
      if (!document.getElementById("typing")) addTyping();
      // A Stop frame may have raced with the disconnect. Re-send it after the
      // server confirms that the foreground run is still alive.
      if (stopRequested) sendStopRequest();
    } else if (isGenerating) {
      // The server's idle snapshot is authoritative after reconnect. If the
      // terminal frame was lost, close whichever local request was still open.
      finishGenerationAndContinue(activeRequestId);
    } else {
      setGenerating(false);
    }
    flushLocalSteering();
    return;
  }

  if (ev.type === "request_queued") {
    if (ev.userMessageId) activeRequestId = ev.userMessageId;
    setGenerating(true);
    updateTypingStatus(`服务端排队中${ev.position ? `（第 ${ev.position} 条）` : ""}...`);
    flushLocalSteering();
    return;
  }

  const lifecycleEvent = TASK_EVENT_TYPES.has(ev.type)
    || (ev.type === "system" && TASK_EVENT_TYPES.has(ev.subtype));
  if (ev.conversationId && currentConvId && ev.conversationId !== currentConvId) {
    return;
  }
  if (lifecycleEvent && activeRequestId && ev.userMessageId !== activeRequestId) {
    // Show cross-turn task progress transiently, but never append A's task block
    // to B's assistantBlocks/history payload.
    updateTypingStatus(`后台任务：${taskEventText(ev)}`);
    return;
  }
  if (!lifecycleEvent && activeRequestId) {
    if (ev.userMessageId && ev.userMessageId !== activeRequestId) return;
    // An owned conversation event without a request ID is a synthetic/background
    // continuation. Do not merge it into the queued foreground request bubble.
    if (!ev.userMessageId && ev.conversationId) return;
  }

  if (ev.type === "system" && ev.subtype === "api_retry") {
    updateTypingStatus(`API 繁忙，正在重试 (${ev.attempt}/${ev.max_retries})…`);
    return;
  }

  if (ev.type === "system" && ev.subtype === "status") {
    const STATUS_LABEL = { compacting: "压缩上下文中…", requesting: "请求中…" };
    updateTypingStatus(STATUS_LABEL[ev.status] ?? "");
    return;
  }

  if (ev.type === "system" && ev.subtype === "init") {
    // ev.skills 是实际的技能列表；ev.slash_commands 是内置命令列表
    // 优先使用 ev.skills，否则回退到 ev.slash_commands（旧版 SDK 兼容）
    if (ev.provider) currentSkillProvider = ev.provider;
    const skillList = Array.isArray(ev.skills) && ev.skills.length > 0
      ? ev.skills
      : (Array.isArray(ev.slash_commands) ? ev.slash_commands : []);
    buildCommandList(skillList);
    return;
  }

  if (ev.type === "rate_limit_event") {
    return;
  }

  if (ev.type === "system" && ev.subtype === "session_state_changed") {
    if (ev.state === "running" || ev.state === "requires_action") {
      setGenerating(true);
      if (!assistantEl && !document.getElementById("typing")) addTyping();
    } else if (ev.state === "idle") {
      updateTypingStatus("");
    }
    return;
  }

  if (ev.type === "system" && TASK_EVENT_TYPES.has(ev.subtype)) {
    assistantEvents.push(cloneJson(ev));
    subagentIngest(ev);
    return;
  }

  // Codex 的串行计划
  if (ev.type === "tool_progress" && ev.itemType === "todo_list") {
    subagentIngest(ev);
    return;
  }

  // 子 agent 自己的事件靠 parent_tool_use_id 归位到对应分支，
  // 不再和主 agent 的工具调用交错平铺在一起。
  if (ev.parent_tool_use_id) {
    subagentIngest(ev);
    return;
  }

  if (ev.type === "ask_user_question") {
    renderAskUserQuestion(ev);
    return;
  }

  if (ev.type === "ask_user_question_cancelled") {
    if (!pendingAskUserQuestion || pendingAskUserQuestion.requestId === ev.requestId) {
      clearAskUserQuestion();
      updateGenChip("");
    }
    return;
  }

  if (ev.type === "ask_user_question_error") {
    if (!pendingAskUserQuestion || pendingAskUserQuestion.requestId === ev.requestId) clearAskUserQuestion();
    showInlineError(ev.text || "Clarification question expired.");
    return;
  }

  // ── Streaming deltas ──────────────────────────────────────
  if (ev.type === "stream_event") {
    const event = ev.event;
    if (!event) return;

    // New turn after tool call — tool finished, remove running state, reset indices
    if (event.type === "message_start") {
      cleanupRunningTools();
      updateGenChip("继续处理…");
      for (const b of Object.values(blockMap)) {
        if (b.type === "text" && b.accumulated) prevTurnTexts.push(b.accumulated);
      }
      blockMap = {};
      return;
    }

    // New block — create DOM element in arrival order and append to body
    if (event.type === "content_block_start") {
      const block = event.content_block;
      if (!block) return;
      const idx = event.index;
      if (!assistantEl) { removeTyping(); assistantEl = addMessage("assistant", ""); }
      if (!genChipEl) showGenChip("");
      const body = assistantEl.querySelector(".msg-body");

      if (block.type === "thinking") {
        removeGenChip();
        const el = document.createElement("details");
        el.className = "thinking-block thinking-active";
        el.setAttribute("open", "");
        el.innerHTML = `<summary class="thinking-summary"><span class="thinking-dot"></span><span class="thinking-label">正在思考</span><span class="thinking-chevron">▶</span></summary><div class="thinking-content"></div>`;
        body.appendChild(el);
        blockMap[idx] = { el, type: "thinking", accumulated: "" };
      } else if (block.type === "text") {
        updateGenChip("");
        const el = document.createElement("div");
        el.className = "msg-text";
        body.appendChild(el);
        reanchorGenChip();
        blockMap[idx] = { el, type: "text", accumulated: "" };
      } else if (isToolUseType(block.type)) {
        // Task 走编队卡。此刻 input 还在流式累积中，等 content_block_stop
        // 拿到完整 JSON 才知道 description，所以先只登记不渲染。
        if (isSubagentTool(block.name)) {
          blockMap[idx] = { el: null, type: block.type, accumulated: "", id: block.id, name: block.name, isTask: true };
          updateGenChip("正在分派子任务…");
          return;
        }
        updateGenChip("调用工具中…");
        const el = makeToolEl({
          id: block.id,
          name: block.name,
          serverName: block.server_name ?? block.serverName ?? null,
          input: block.input ?? {},
        });
        body.appendChild(el);
        reanchorGenChip();
        markToolRunning(el);
        blockMap[idx] = { el, type: block.type, accumulated: "", id: block.id };
      } else if (block.type === "web_search_tool_result" || block.type === "web_fetch_tool_result" || isToolResultType(block.type)) {
        cleanupRunningTools();
        const el = makeHistoryBlock(blockTypeLabel(block.type), block);
        body.appendChild(el);
        reanchorGenChip();
        blockMap[idx] = { el, type: block.type, accumulated: "", raw: block };
      } else {
        const el = makeHistoryBlock(blockTypeLabel(block.type), block);
        body.appendChild(el);
        reanchorGenChip();
        blockMap[idx] = { el, type: block.type || "unknown", accumulated: "", raw: block };
      }
      return;
    }

    // Delta — stream content into the existing element
    if (event.type === "content_block_delta") {
      const { delta, index: idx } = event;
      if (!delta || !blockMap[idx]) return;
      const b = blockMap[idx];

      if (delta.type === "text_delta" && delta.text) {
        b.accumulated += delta.text;
        b.el.innerHTML = renderMarkdown(b.accumulated);
        assistantTxt = [...prevTurnTexts,
          ...Object.values(blockMap).filter(x => x.type === "text").map(x => x.accumulated),
        ].filter(Boolean).join("\n\n");
        scrollBottom();
      } else if (delta.type === "thinking_delta" && delta.thinking) {
        b.accumulated += delta.thinking;
        const tc = b.el.querySelector(".thinking-content");
        tc.textContent = b.accumulated;
        tc.scrollTop = tc.scrollHeight;
        scrollBottom();
      } else if (delta.type === "input_json_delta" && delta.partial_json != null) {
        b.accumulated += delta.partial_json;
        const inp = b.el?.querySelector(".tool-input");   // Task 块没有 el
        if (inp) { inp.textContent = b.accumulated.slice(0, 120); scrollBottom(); }
      }
      return;
    }

    // Block complete — finalise tool input, then mark chip as running
    if (event.type === "content_block_stop") {
      const b = blockMap[event.index];
      if (b?.type === "thinking") {
        // 思考结束：去掉动画，折叠，改回"思考过程"
        b.el.classList.remove("thinking-active");
        b.el.removeAttribute("open");
        const label = b.el.querySelector(".thinking-label");
        if (label) label.textContent = "思考过程";
        showGenChip("整理回复中…");
      }
      // Task 的 input 到这里才完整，此时才知道该给分支起什么名字
      if (b?.isTask) {
        let desc = "";
        let origin = null;
        try {
          const raw = JSON.parse(b.accumulated || "{}");
          desc = isDispatchTool(b.name)
            ? dispatchCardLabel(raw)
            : (raw.description || raw.subagent_type || "");
          if (isDispatchTool(b.name)) origin = dispatchProviderInfo(raw.provider);
        } catch { }
        currentSquad(true).spawn(b.id, desc || "子任务", origin);
        return;
      }
      if (isToolUseType(b?.type)) {
        try {
          const raw = JSON.parse(b.accumulated || "{}");
          const preview = raw.command ?? raw.file_path ?? raw.path ?? raw.query ?? raw.url ?? JSON.stringify(raw);
          const inp = b.el?.querySelector(".tool-input");
          if (inp) { inp.textContent = String(preview).slice(0, 120); inp.title = JSON.stringify(raw, null, 2); }
        } catch { }
        // 输入完成 → 工具执行中，保持 spinner
        if (b.el) markToolRunning(b.el);
      }
      return;
    }
    return;
  }

  // ── Complete assistant turn ────────────────────────────────
  if (ev.type === "assistant") {
    subagentIngest(ev);   // 认领其中的 Task 工具派生，其余内容照常渲染
    const content = ev.message?.content ?? [];
    const turnBlocks = normalizeAssistantBlocks(content, "");
    if (turnBlocks.length) assistantBlocks.push(...turnBlocks);
    assistantRawMessages.push(cloneJson(ev.message ?? ev));

    if (!assistantEl) {
      // No streaming — render each block in order
      removeTyping();
      assistantEl = addMessage("assistant", "");
    }
    if (!genChipEl && isGenerating) showGenChip("");
    const body = assistantEl.querySelector(".msg-body");
    if (!assistantBlocks.some((block) => block.type === "text") && assistantTxt) {
      assistantBlocks.push({ type: "text", text: assistantTxt });
    }
    body.innerHTML = "";
    renderAssistantBlocks(body, assistantBlocks);
    reanchorGenChip();
    markLiveToolBlocksRunning(turnBlocks);
    assistantTxt = textFromAssistantBlocks(assistantBlocks) || assistantTxt;
    scrollBottom();
    return;
  }

  if (ev.type === "user" && isToolResultEvent(ev)) {
    subagentIngest(ev);   // 派生的 tool_result → 该分支合流
    for (const b of ev.message?.content ?? []) {
      if (b?.type === "tool_result") markToolSettled(b.tool_use_id, b.is_error);
    }
    cleanupRunningTools();
    return;
  }

  if (isToolUseType(ev.type)) {
    if (!assistantEl) { removeTyping(); assistantEl = addMessage("assistant", ""); }
    if (!genChipEl && isGenerating) showGenChip("调用工具中…");
    const block = {
      type: ev.type,
      id: ev.id ?? "",
      name: ev.name ?? "tool",
      serverName: ev.server_name ?? ev.serverName ?? null,
      input: ev.input ?? {},
      raw: cloneJson(ev),
    };
    assistantBlocks.push(block);
    const el = makeToolEl(block);
    const body = assistantEl.querySelector(".msg-body");
    body.appendChild(el);
    reanchorGenChip();
    markToolRunning(el);
    scrollBottom();
    return;
  }

  if (isToolResultType(ev.type)) {
    cleanupRunningTools();
    if (!assistantEl) { removeTyping(); assistantEl = addMessage("assistant", ""); }
    if (!genChipEl && isGenerating) showGenChip("");
    const block = { type: ev.type, raw: cloneJson(ev) };
    assistantBlocks.push(block);
    const body = assistantEl.querySelector(".msg-body");
    appendAssistantBlock(body, block);
    reanchorGenChip();
    scrollBottom();
    return;
  }

  if (TASK_EVENT_TYPES.has(ev.type) || (ev.type === "system" && TASK_EVENT_TYPES.has(ev.subtype))) {
    renderTaskStatusEvent(ev);
    return;
  }

  if (ev.type === "result") {
    const savedText = assistantTxt;
    const savedBlocks = cloneJson(assistantBlocks);
    const savedRawMessages = cloneJson(assistantRawMessages);
    const savedEvents = cloneJson(assistantEvents);
    let resultCost = null;
    if (ev.total_cost_usd != null) {
      resultCost = ev.total_cost_usd;
    }
    resetAssistantState();
    if (savedText || savedBlocks?.length) {
      const resultWasStopped = stopRequested && ev.userMessageId && ev.userMessageId === activeRequestId;
      messageLog.push({ id: genId(), role: "assistant", text: savedText, blocks: savedBlocks, raw: savedRawMessages, events: savedEvents, cost: resultCost, status: resultWasStopped ? "stopped" : "complete" });
      saveCurrentConversation();
    }
    return;
  }

  if (ev.type === "done" || ev.type === "stopped") {
    // 停止时服务端不会再补 tool_result（回合号已变），卡片得自己收尾。
    // done 也一并收：正常结束还挂着"进行中"的，同样是没等到结果的孤儿。
    if (ev.type === "stopped") settleRunningSquadTasks("已停止", ev.userMessageId ?? activeRequestId);
    finishGenerationAndContinue(ev.userMessageId ?? null);
    return;
  }

  if (ev.type === "error") {
    clearAskUserQuestion();
    cleanupRunningTools();
    settleRunningSquadTasks("已中断", ev.userMessageId ?? activeRequestId);
    showInlineError(ev.text?.trim() || "发生错误");
    if (!activeRequestId || ev.userMessageId === activeRequestId) {
      finishGenerationAfterError(ev.userMessageId ?? null);
    }
    return;
  }

  if (ev.type === "session" && ev.sessionId) {
    currentSessionId = ev.sessionId;
    return;
  }

  captureAssistantEvent(ev);
}

// ── DOM helpers ───────────────────────────────────────────
function addMessage(role, text, imageUrls) {
  const wrap = document.createElement("div");
  wrap.className = `msg msg-${role}`;
  const body = document.createElement("div");
  body.className = "msg-body";
  if (imageUrls?.length) {
    const imgRow = document.createElement("div");
    imgRow.style.cssText = "display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;";
    imageUrls.forEach(url => {
      const img = document.createElement("img");
      img.src = url;
      img.style.cssText = "max-height:160px;max-width:100%;border-radius:5px;object-fit:cover;";
      imgRow.appendChild(img);
    });
    body.appendChild(imgRow);
  }
  // For assistant, only add initial text element if there's actual text (shell calls pass "")
  if (role !== "assistant" || text) {
    const textEl = document.createElement("div");
    textEl.className = role === "assistant" ? "msg-text" : "";
    textEl.innerHTML = role === "assistant" ? renderMarkdown(text) : renderPlain(text);
    if (role === "user") textEl.style.whiteSpace = "pre-wrap";
    body.appendChild(textEl);
  }
  wrap.appendChild(body);
  messagesEl.appendChild(wrap);
  scrollBottom();
  return wrap;
}

function makeToolEl(tool) {
  const el = document.createElement("div");
  el.className = "tool-call";
  el.dataset.toolId = tool.id;
  const name = document.createElement("span");
  name.className = "tool-name";
  name.textContent = tool.serverName ? `${tool.serverName}:${tool.name}` : tool.name;
  const inp = document.createElement("span");
  inp.className = "tool-input";
  const raw = tool.input ?? {};
  const preview = raw.command ?? raw.file_path ?? raw.path ?? raw.query ?? raw.url ?? JSON.stringify(raw);
  inp.textContent = String(preview).slice(0, 120);
  inp.title = JSON.stringify(raw, null, 2);
  el.appendChild(name); el.appendChild(inp);
  return el;
}

function makeTaskStatusEl(block) {
  const el = document.createElement("div");
  el.className = "tool-call task-status";
  el.dataset.taskStatusId = block.taskId;
  const name = document.createElement("span");
  name.className = "tool-name";
  name.textContent = blockTypeLabel(block.eventType);
  const detail = document.createElement("span");
  detail.className = "tool-input";
  detail.textContent = block.text;
  detail.title = jsonPreview(block.raw ?? block);
  el.append(name, detail);
  if (!block.done && isGenerating) markToolRunning(el);
  return el;
}

function makeHistoryBlock(label, raw, leadText = "") {
  const el = document.createElement("details");
  el.className = "history-block";
  const summary = document.createElement("summary");
  summary.textContent = label;
  const content = document.createElement("div");
  content.className = "history-block-content";
  const rawText = jsonPreview(raw);
  content.textContent = leadText ? `${leadText}\n\n${rawText}` : rawText;
  el.appendChild(summary);
  el.appendChild(content);
  return el;
}

function extractResultItems(raw) {
  const content = raw?.content ?? raw?.raw?.content ?? [];
  if (Array.isArray(content)) return content;
  if (content && typeof content === "object") return [content];
  return [];
}

function makeSearchResultBlock(block) {
  const raw = block.raw ?? block;
  const el = document.createElement("details");
  el.className = "history-block";
  const summary = document.createElement("summary");
  summary.textContent = blockTypeLabel(block.type);
  el.appendChild(summary);

  const results = extractResultItems(raw);
  if (results.length) {
    const list = document.createElement("div");
    list.className = "history-block-results";
    for (const item of results.slice(0, 8)) {
      const row = document.createElement("div");
      row.className = "history-result";
      const title = document.createElement("div");
      title.className = "history-result-title";
      title.textContent = item.title || item.type || "结果";
      row.appendChild(title);
      if (item.url) {
        const url = document.createElement("div");
        url.className = "history-result-url";
        url.textContent = item.url;
        row.appendChild(url);
      }
      if (item.page_age) {
        const age = document.createElement("div");
        age.className = "history-result-url";
        age.textContent = item.page_age;
        row.appendChild(age);
      }
      list.appendChild(row);
    }
    el.appendChild(list);
  }

  const rawEl = document.createElement("div");
  rawEl.className = "history-block-content";
  rawEl.textContent = jsonPreview(raw);
  el.appendChild(rawEl);
  return el;
}

/* 进行中的指示器（typing / gen-chip）自带停止入口。停止属于"这条正在生成的回答"，
   把它挂在这里，输入区就不用为一个偶尔才需要的动作常驻第二个按钮。 */
function addTyping() {
  removeTyping();
  const el = document.createElement("div");
  el.id = "typing"; el.className = "msg";
  el.innerHTML = `<div class="typing"><span></span><span></span><span></span><small class="typing-status"></small></div>`;
  messagesEl.appendChild(el); scrollBottom();
}
function removeTyping() { document.getElementById("typing")?.remove(); }

function showGenChip(text) {
  if (!genChipEl) {
    genChipEl = document.createElement("div");
    genChipEl.className = "gen-chip";
    genChipEl.innerHTML = `<span class="gen-chip-dot"></span><span class="gen-chip-label"></span>`;
  }

}
function updateGenChip(text) {
  if (!genChipEl) return;
  genChipEl.querySelector(".gen-chip-label").textContent = text || "";
  reanchorGenChip();
}
function reanchorGenChip() {
  if (!genChipEl || !assistantEl) return;
  const body = assistantEl.querySelector(".msg-body");
  if (body) body.appendChild(genChipEl);
}
function removeGenChip() {

  genChipEl = null;
}

function updateTypingStatus(text) {
