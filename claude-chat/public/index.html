  if (el) el.textContent = text ? ` ${text}` : "";
}
function scrollBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }


// ── Composer popup: slash commands + @ note mentions ─────
let popupItems  = [];
let activeIndex = -1;
let popupMode = null;

function getSlashQuery() {
  const val = promptEl.value;
  if (!val.startsWith("/")) return null;
  const afterSlash = val.slice(1);
  // hide once user typed a space (they've committed to a command)
  if (afterSlash.includes(" ")) return null;
  return afterSlash.toLowerCase();
}

function highlightPopupMatch(value, query) {
  const text = String(value);
  if (!query) return escapeHtml(text);
  const index = text.toLocaleLowerCase().indexOf(String(query).toLocaleLowerCase());
  if (index < 0) return escapeHtml(text);
  return escapeHtml(text.slice(0, index))
    + `<em>${escapeHtml(text.slice(index, index + query.length))}</em>`
    + escapeHtml(text.slice(index + query.length));
}

function renderSlashPopup(query) {
  const matches = slashCommands.filter((c) =>
    query === "" || c.name.toLowerCase().includes(query)
  );

  if (matches.length === 0) { hidePopup(); return; }

  popupItems = matches;
  activeIndex = 0;
  popupMode = "slash";

  const builtins = matches.filter((c) => c.kind === "builtin");
  const skills   = matches.filter((c) => c.kind === "skill");

  let idx = 0;
  const renderGroup = (label, items) => {
    if (!items.length) return "";
    let html = `<div class="slash-header">${label}</div>`;
    for (const c of items) {
      const highlighted = highlightPopupMatch(c.name, query);
      const badge = c.kind === "builtin"
        ? `<span class="slash-badge builtin">内置</span>`
        : `<span class="slash-badge skill">skill</span>`;
      html += `<button class="slash-item${idx === 0 ? " active" : ""}" data-i="${idx++}" role="option">
        <span class="slash-cmd">/${highlighted}</span>
        ${c.desc ? `<span class="slash-desc">${c.desc}</span>` : ""}
        ${badge}
      </button>`;
    }
    return html;
  };

  popupEl.innerHTML =
    renderGroup("内置命令", builtins) +
    renderGroup("Skills", skills);

  popupEl.setAttribute("aria-label", "命令列表");
  popupEl.classList.add("open");
}

function getMentionQuery() {
  const cursor = promptEl.selectionStart ?? promptEl.value.length;
  const beforeCursor = promptEl.value.slice(0, cursor);
  const mentionStart = beforeCursor.lastIndexOf("@");
  if (mentionStart < 0) return null;
  if (mentionStart > 0 && !/[\s([{"'“‘，。！？、；：]/u.test(beforeCursor[mentionStart - 1])) return null;

  const query = beforeCursor.slice(mentionStart + 1);
  if (query.includes("\n") || query.length > 80) return null;
  return { query, start: mentionStart, end: cursor };
}

// 厂商派发用 ">" 触发，与笔记引用的 "@" 分开，互不遮挡。
// 只认消息开头，且 ">" 后不含空白 —— 这样 markdown 引用块（"> 引用的话"）不会误触发。
function getProviderQuery() {
  const cursor = promptEl.selectionStart ?? promptEl.value.length;
  const beforeCursor = promptEl.value.slice(0, cursor);
  if (!beforeCursor.startsWith(">")) return null;
  const query = beforeCursor.slice(1);
  if (/\s/.test(query) || query.length > 40) return null;
  return { query, start: 0, end: cursor };
}

function renderProviderPopup(mention) {
  if (mention.start !== 0) return false;
  const query = normalizeMentionSearch(mention.query);
  const matches = _dispatchProviders
    .filter((profile) => !query
      || normalizeMentionSearch(profile.provider).includes(query)
      || normalizeMentionSearch(profile.name).includes(query))
    .slice(0, 12);
  if (matches.length === 0) return false;

  popupItems = matches;
  activeIndex = 0;
  popupMode = "provider";
  popupEl.innerHTML = `
    <div class="slash-header">派发给其他厂商</div>
    ${matches.map((profile, index) => `
      <button class="slash-item mention-item${index === 0 ? " active" : ""}" data-i="${index}" role="option">
        <span class="slash-cmd">&gt;${highlightPopupMatch(dispatchTokenFor(profile), mention.query)}</span>
        <span class="slash-desc" title="${escapeAttr(profile.goodAt || "")}">${escapeHtml(profile.goodAt || profile.name)}</span>
        <span class="slash-badge provider">${escapeHtml(profile.model || profile.name)}</span>
      </button>
    `).join("")}`;
  popupEl.setAttribute("aria-label", "厂商列表");
  popupEl.classList.add("open");
  return true;
}

function mentionScore(note, query) {
  if (!query) return 4;
  if (note.searchTitle === query) return 0;
  if (note.searchAliases?.some((alias) => alias === query)) return 0;
  if (note.searchTitle.startsWith(query)) return 1;
  if (note.searchAliases?.some((alias) => alias.startsWith(query))) return 1;
  if (note.searchPath.startsWith(query)) return 2;
  return 3;
}

function renderMentionPopup(mention) {
  const query = normalizeMentionSearch(mention.query);
  const matches = vaultNotes
    .filter((note) => !selectedMentionNotes.has(note.path))
    .filter((note) => !query
      || note.searchTitle.includes(query)
      || note.searchPath.includes(query)
      || note.searchAliases?.some((alias) => alias.includes(query)))
    .sort((a, b) => mentionScore(a, query) - mentionScore(b, query)
      || a.title.localeCompare(b.title, "zh-CN"))
    .slice(0, 20);

  if (matches.length === 0) { hidePopup(); return; }

  popupItems = matches;
  activeIndex = 0;
  popupMode = "mention";
  popupEl.innerHTML = `
    <div class="slash-header">添加笔记上下文</div>
    ${matches.map((note, index) => `
      <button class="slash-item mention-item${index === 0 ? " active" : ""}" data-i="${index}" role="option">
        <span class="slash-cmd">${highlightPopupMatch(note.title, mention.query)}</span>
        <span class="slash-desc" title="${escapeAttr(note.path)}">${escapeHtml(note.aliases?.length ? `${note.aliases.join(" · ")} · ${note.path}` : note.path)}</span>
        <span class="slash-badge note">${escapeHtml(note.kind === "pdf" ? "PDF" : note.kind === "image" ? "图片" : note.kind === "html" ? "HTML" : "笔记")}</span>
      </button>
    `).join("")}`;
  popupEl.setAttribute("aria-label", "笔记列表");
  popupEl.classList.add("open");
}

function hidePopup() {
  popupEl.classList.remove("open");
  popupItems = [];
  activeIndex = -1;
  popupMode = null;
}

function setActive(i) {
  const items = popupEl.querySelectorAll(".slash-item");
  items.forEach((el, idx) => el.classList.toggle("active", idx === i));
  activeIndex = i;
  items[i]?.scrollIntoView({ block: "nearest" });
}

function selectItem(i) {
  const item = popupItems[i];
  if (!item) return;
  if (popupMode === "provider") {
    const range = getProviderQuery();
    if (!range) {
      hidePopup();
      return;
    }
    promptEl.setRangeText(`>${dispatchTokenFor(item)} `, range.start, range.end, "end");
    promptEl.style.height = "36px";
    promptEl.style.height = Math.min(promptEl.scrollHeight, 160) + "px";
    hidePopup();
    promptEl.focus();
    syncComposerAction();
    return;
  }
  if (popupMode === "mention") {
    const range = getMentionQuery();
    if (!range) {
      hidePopup();
      return;
    }
    selectedMentionNotes.set(item.path, item);
    promptEl.setRangeText("", range.start, range.end, "end");
    promptEl.style.height = "36px";
    promptEl.style.height = Math.min(promptEl.scrollHeight, 160) + "px";
    renderMentionChips();
    hidePopup();
    promptEl.focus();
    syncComposerAction();
    return;
  }
  // /clear is handled locally; everything else is sent to claude
  if (item.name === "clear") {
    hidePopup();
    submitRequest("/clear", { consumeComposer: true });
    return;
  }
  // commands with no args: send immediately; skills need args typed first
  promptEl.value = `/${item.name}${item.kind === "builtin" ? "" : " "}`;
  promptEl.style.height = "36px";
  hidePopup();
  promptEl.focus();
  syncComposerAction();
}

// click on popup item
popupEl.addEventListener("mousedown", (e) => {
  const btn = e.target.closest(".slash-item");
  if (btn) { e.preventDefault(); selectItem(Number(btn.dataset.i)); }
});

// ── Input events ──────────────────────────────────────────
function updateComposerPopup() {
  promptEl.style.height = "36px";
  promptEl.style.height = Math.min(promptEl.scrollHeight, 160) + "px";

  const providerQuery = getProviderQuery();
  if (providerQuery && renderProviderPopup(providerQuery)) {
    return;
  }
  const mention = getMentionQuery();
  if (mention && vaultNotes.length > 0) {
    renderMentionPopup(mention);
    return;
  }
  const slashQuery = getSlashQuery();
  if (slashQuery !== null) renderSlashPopup(slashQuery);
  else hidePopup();
}

promptEl.addEventListener("input", updateComposerPopup);
promptEl.addEventListener("click", updateComposerPopup);
// 草稿有没有内容决定主按钮是"发送/追加"还是"停止"，每次改动都要重算
promptEl.addEventListener("input", syncComposerAction);
promptEl.addEventListener("keyup", (e) => {
  if (["ArrowLeft", "ArrowRight", "Home", "End", "PageUp", "PageDown"].includes(e.key)) {
    updateComposerPopup();
  }
});

promptEl.addEventListener("keydown", (e) => {
  if (e.isComposing) return;
  if (popupEl.classList.contains("open")) {
    if (e.key === "ArrowDown") {
      e.preventDefault();
      setActive(Math.min(activeIndex + 1, popupItems.length - 1));
      return;
    }
    if (e.key === "ArrowUp") {
      e.preventDefault();
      setActive(Math.max(activeIndex - 1, 0));
      return;
    }
    if (e.key === "Enter" || e.key === "Tab") {
      e.preventDefault();
      selectItem(activeIndex);
      return;
    }
    if (e.key === "Escape") {
      e.preventDefault();
      hidePopup();
      return;
    }
  }

  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

// hide popup when clicking elsewhere
document.addEventListener("mousedown", (e) => {
  if (!popupEl.contains(e.target) && e.target !== promptEl) hidePopup();
});

// ── Send ──────────────────────────────────────────────────
function parseProviderDispatchText(value) {
  // ">" 紧跟厂商名（中间无空格）才算派发指令；"> 引用的话" 这种 markdown
  // 引用块因为紧跟空格而匹配不上，会照常当普通消息发出去。
  const match = String(value || "").trim().match(/^>([^\s]+)\s+([\s\S]+)$/);
  if (!match) return null;
  const profile = findDispatchProvider(match[1]);
  const task = match[2].trim();
  if (!profile || !task) return null;
  return {
    profile,
    task,
    displayText: String(value || "").trim(),
  };
}

function takeRequestDraft(textOverride = null, { consumeComposer = textOverride == null, noteFile = undefined } = {}) {
  const rawText = String(textOverride ?? promptEl.value).trim();
  if (!rawText) return null;
  const providerDispatch = parseProviderDispatchText(rawText);
  const draft = {
    composerText: rawText,
    text: providerDispatch?.task || rawText,
    displayText: providerDispatch?.displayText || null,
    dispatchProvider: providerDispatch?.profile.id || null,
    dispatchReason: providerDispatch ? "用户通过 > 明确指定厂商" : null,
    mentionedNotes: consumeComposer ? [...selectedMentionNotes.values()] : [],
    images: consumeComposer ? pendingImages.map((image) => ({ ...image })) : [],
    noteFile: noteFile !== undefined
      ? noteFile
      : (currentNoteFile && noteContextEnabled ? currentNoteFile : null),
    quote: consumeComposer && quotedText ? {
      text: quotedText,
      section: quotedSection,
      prefix: quotedPrefix,
      suffix: quotedSuffix,
    } : null,
    model: selectedModel,
    permissionMode: selectedPermissionMode,
    effort: selectedEffort,
    profileId: _profileData.activeProfileId,
    conversationId: currentConvId,
  };

  if (consumeComposer) {
    promptEl.value = "";
    promptEl.style.height = "36px";
    clearMentionNotes();
    clearImages();
    quotedText = null;
    quotedSection = null;
    quotedPrefix = null;
    quotedSuffix = null;
    quoteChip.classList.remove("visible");
    // 草稿被消费掉了 —— 生成中的话主按钮此刻应该让位给"停止"
    syncComposerAction();
  }
  return draft;
}

function prepareRequestDraft(draft) {
  const mentionedNotes = Array.isArray(draft.mentionedNotes) ? draft.mentionedNotes : [];
  const composerText = String(draft.composerText || draft.text || "").trim();
  draft.composerText = composerText;
  draft.displayText = draft.dispatchProvider
    ? composerText
    : (mentionedNotes.length > 0
      ? `${draft.text}\n\n引用笔记：${mentionedNotes.map((note) => `@${note.title}`).join(" · ")}`
      : draft.text);

  const parts = [];
  if (draft.noteFile) parts.push(`当前查看的文件：${draft.noteFile}`);
  if (mentionedNotes.length > 0) {
    parts.push(
      "用户指定以下 vault 笔记作为本轮上下文。请优先读取这些文件，并基于其中内容回答：\n"
      + mentionedNotes.map((note) => `- ${JSON.stringify(note.path)}`).join("\n"),
    );
  }
  if (draft.quote) {
    const sectionHint = draft.quote.section ? `（「${draft.quote.section}」章节）` : "";
    let anchor = "";
    if (draft.quote.prefix || draft.quote.suffix) {
      const pre = draft.quote.prefix ? `…${draft.quote.prefix}` : "";
      const suf = draft.quote.suffix ? `${draft.quote.suffix}…` : "";
      anchor = `\n位置锚点：${pre}【${draft.quote.text}】${suf}`;
    }
    parts.push(`用户引用了以下文段${sectionHint}：\n"${draft.quote.text}"${anchor}`);
  }
  parts.push(draft.text);
  draft.prompt = parts.join("\n\n");
  return draft;
}

function requestPayloadForDraft(draft, deliveryMode = null) {
  prepareRequestDraft(draft);
  const payload = {
    conversationId: draft.conversationId,
    userMessageId: draft.userMessageId,
    displayText: draft.displayText,
    composerText: draft.composerText,
    prompt: draft.prompt,
    model: draft.model,
    permissionMode: draft.permissionMode,
    effort: draft.effort,
    profileId: draft.profileId,
  };
  if (deliveryMode) payload.deliveryMode = deliveryMode;
  if (draft.dispatchProvider) {
    payload.dispatchProvider = draft.dispatchProvider;
    payload.dispatchReason = draft.dispatchReason;
  }
  if (draft.images?.length > 0) {
    payload.images = draft.images.map((image) => ({ data: image.data, mediaType: image.mediaType }));
  }
  return payload;
}

function normalizeSteeringEvent(raw = {}) {
  return {
    ...raw,
    id: String(raw.userMessageId || raw.steeringId || ""),
    conversationId: raw.conversationId || currentConvId || null,
    displayText: String(raw.displayText || raw.text || ""),
    composerText: String(raw.composerText || raw.displayText || raw.text || ""),
    position: Number.isFinite(Number(raw.position)) ? Number(raw.position) : null,
    delivery: raw.delivery === "next_turn" ? "next_turn" : "steer",
    paused: Boolean(raw.paused),
  };
}

function steeringById(id) {
  return steeringQueue.find((item) => item.id === id) || null;
}

function steeringStateLabel(item) {
  if (item.removing) return "正在移除";
  if (item.paused || item.status === "paused") return "已暂停";
  if (item.status === "sending") return "正在加入";
  if (item.delivery === "next_turn") return "等待 AI 接收";
  return "等待当前步骤";
}

function steeringContextLabel(item) {
  const bits = [];
  const imageCount = item.draft?.images?.length || 0;
  const noteCount = item.draft?.mentionedNotes?.length || 0;
  if (imageCount) bits.push(`${imageCount} 张图片`);
  if (noteCount) bits.push(`${noteCount} 篇笔记`);
  if (item.draft?.noteFile) bits.push("当前笔记");
  if (item.draft?.quote) bits.push("含引用");
  return bits.join(" · ");
}

function steeringAction(label, title, className, onClick, disabled = false) {
  const button = document.createElement("button");
  button.type = "button";
  button.className = `steering-action ${className}`;
  button.textContent = label;
  button.title = title;
  button.setAttribute("aria-label", title);
  button.disabled = disabled;
  button.addEventListener("click", onClick);
  return button;
}

function renderSteeringTray() {
  const count = steeringQueue.length;
  steeringTrayEl.classList.toggle("visible", count > 0);
  steeringTrayEl.hidden = count === 0;
  steeringTrayTitleEl.textContent = count > 0 ? `追加到当前任务 · ${count}` : "追加到当前任务";
  steeringListEl.innerHTML = "";
  if (count === 0) return;

  steeringQueue.forEach((item, index) => {
    const row = document.createElement("div");
    row.className = "steering-item";
    row.dataset.id = item.id;
    row.dataset.state = item.paused ? "paused" : item.status;
    row.setAttribute("role", "listitem");
    row.draggable = steeringEditingId !== item.id;

    const grip = document.createElement("button");
    grip.type = "button";
    grip.className = "steering-grip";
    grip.textContent = "⋮⋮";
    grip.title = "拖动调整顺序";
    grip.setAttribute("aria-label", "拖动调整顺序");
    grip.tabIndex = -1;
    row.appendChild(grip);

    if (steeringEditingId === item.id) {
      const edit = document.createElement("div");
      edit.className = "steering-edit";
      const textarea = document.createElement("textarea");
      textarea.value = item.draft?.composerText || item.displayText || "";
      textarea.setAttribute("aria-label", "编辑待追加消息");
      const actions = document.createElement("div");
      actions.className = "steering-edit-actions";
      const cancel = document.createElement("button");
      cancel.type = "button";
      cancel.textContent = "取消";
      cancel.addEventListener("click", () => {
        steeringEditingId = null;
        renderSteeringTray();
      });
      const save = document.createElement("button");
      save.type = "button";
      save.className = "save";
      save.textContent = "保存";
      save.addEventListener("click", () => updateSteeringItem(item.id, textarea.value));
      textarea.addEventListener("keydown", (event) => {
        if (event.isComposing) return;
        if (event.key === "Escape") {
          event.preventDefault();
          cancel.click();
        } else if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) {
          event.preventDefault();
          save.click();
        }
      });
      actions.append(cancel, save);
      edit.append(textarea, actions);
      row.appendChild(edit);
      steeringListEl.appendChild(row);
      queueMicrotask(() => {
        textarea.focus();
        textarea.setSelectionRange(textarea.value.length, textarea.value.length);
      });
      return;
    }

    const copy = document.createElement("div");
    copy.className = "steering-copy";
    const summary = document.createElement("div");
    summary.className = "steering-summary";
    summary.textContent = item.displayText || item.draft?.composerText || "待追加消息";
    summary.title = summary.textContent;
    const meta = document.createElement("div");
    meta.className = "steering-meta";
    const state = document.createElement("span");
    state.className = "steering-state";
    state.textContent = steeringStateLabel(item);
    meta.appendChild(state);
    const context = steeringContextLabel(item);
    if (context) {
      const attachments = document.createElement("span");
      attachments.className = "steering-attachments";
      attachments.textContent = context;
      meta.appendChild(attachments);
    }
    copy.append(summary, meta);
    row.appendChild(copy);

    const actions = document.createElement("div");
    actions.className = "steering-actions";
    if (item.paused) {
      actions.appendChild(steeringAction("▶", "继续处理", "resume", () => resumeSteeringItem(item.id)));
    }
    actions.append(
      steeringAction("↑", "上移", "up", () => moveSteeringItem(item.id, -1), index === 0),
      steeringAction("↓", "下移", "down", () => moveSteeringItem(item.id, 1), index === count - 1),
      steeringAction("✎", "编辑", "edit", () => {
        steeringEditingId = item.id;
        renderSteeringTray();
      }),
      steeringAction("×", "删除", "remove", () => removeSteeringItem(item.id)),
    );
    row.appendChild(actions);

    row.addEventListener("dblclick", (event) => {
      if (event.target.closest("button")) return;
      steeringEditingId = item.id;
      renderSteeringTray();
    });
    row.addEventListener("dragstart", (event) => {
      steeringDraggingId = item.id;
      row.classList.add("dragging");
      event.dataTransfer.effectAllowed = "move";
      event.dataTransfer.setData("text/plain", item.id);
    });
    row.addEventListener("dragover", (event) => {
      if (!steeringDraggingId || steeringDraggingId === item.id) return;
      event.preventDefault();
      event.dataTransfer.dropEffect = "move";
      row.classList.add("drag-over");
    });
    row.addEventListener("dragleave", () => row.classList.remove("drag-over"));
    row.addEventListener("drop", (event) => {
      event.preventDefault();
      row.classList.remove("drag-over");
      reorderSteeringBefore(steeringDraggingId, item.id);
    });
    row.addEventListener("dragend", () => {
      steeringDraggingId = null;
      steeringListEl.querySelectorAll(".dragging, .drag-over").forEach((el) => {
        el.classList.remove("dragging", "drag-over");
      });
    });
    steeringListEl.appendChild(row);
  });
}

function sendSteeringCommand(command) {
  if (!ws || ws.readyState !== WebSocket.OPEN) return false;
  try {
    ws.send(JSON.stringify(command));
    return true;
  } catch {
    return false;
  }
}

function sendSteeringOrder() {
  const order = steeringQueue
    .filter((item) => item.serverOwned || item.sent)
    .map((item) => item.id);
  if (order.length > 1) sendSteeringCommand({ type: "steering_reorder", order });
}

function moveSteeringItem(id, delta) {
  const from = steeringQueue.findIndex((item) => item.id === id);
  const to = Math.max(0, Math.min(steeringQueue.length - 1, from + delta));
  if (from < 0 || from === to) return;
  const [item] = steeringQueue.splice(from, 1);
  steeringQueue.splice(to, 0, item);
  renderSteeringTray();
  sendSteeringOrder();
}

function reorderSteeringBefore(sourceId, targetId) {
  if (!sourceId || !targetId || sourceId === targetId) return;
  const from = steeringQueue.findIndex((item) => item.id === sourceId);
  let to = steeringQueue.findIndex((item) => item.id === targetId);
  if (from < 0 || to < 0) return;
  const [item] = steeringQueue.splice(from, 1);
  if (from < to) to -= 1;
  steeringQueue.splice(to, 0, item);
  renderSteeringTray();
  sendSteeringOrder();
}

function updateSteeringItem(id, value) {
  const item = steeringById(id);
  const composerText = String(value || "").trim();
  if (!item || !composerText) return;
  const providerDispatch = parseProviderDispatchText(composerText);
  item.draft.composerText = composerText;
  item.draft.text = providerDispatch?.task || composerText;
  item.draft.dispatchProvider = providerDispatch?.profile.id || null;
  item.draft.dispatchReason = providerDispatch ? "用户通过 > 明确指定厂商" : null;
  prepareRequestDraft(item.draft);
  item.displayText = item.draft.displayText;
  steeringEditingId = null;
  if (item.serverOwned || item.sent) {
    item.status = "sending";
    if (!sendSteeringCommand({
      type: "steering_update",
      userMessageId: id,
      displayText: item.draft.displayText,
      composerText: item.draft.composerText,
      prompt: item.draft.prompt,
    })) {
      item.status = item.paused ? "paused" : "waiting";
    }
  }
  renderSteeringTray();
}

function removeSteeringItem(id) {
  const index = steeringQueue.findIndex((item) => item.id === id);
  if (index < 0) return;
  const item = steeringQueue[index];
  if (item.serverOwned || item.sent) {
    steeringRemovalPending.add(id);
    item.removing = true;
    item.status = "sending";
    if (!sendSteeringCommand({ type: "steering_remove", userMessageId: id })) {
      steeringRemovalPending.delete(id);
      item.removing = false;
      item.status = item.paused ? "paused" : "waiting";
    }
  } else {
    steeringQueue.splice(index, 1);
  }
  if (steeringEditingId === id) steeringEditingId = null;
  renderSteeringTray();
}

function resumeSteeringItem(id) {
  const item = steeringById(id);
  if (!item) return;
  item.paused = false;
  item.status = "sending";
  if (!sendSteeringCommand({ type: "steering_resume", userMessageId: id })) {
    item.paused = true;
    item.status = "paused";
  }
  renderSteeringTray();
}

function clearSteeringQueue() {
  for (let index = steeringQueue.length - 1; index >= 0; index -= 1) {
    const item = steeringQueue[index];
    if (!item.serverOwned && !item.sent) {
      steeringQueue.splice(index, 1);
      continue;
    }
    steeringRemovalPending.add(item.id);
    item.removing = true;
    item.status = "sending";
    if (!sendSteeringCommand({ type: "steering_remove", userMessageId: item.id })) {
      steeringRemovalPending.delete(item.id);
      item.removing = false;
      item.status = item.paused ? "paused" : "waiting";
    }
  }
  steeringEditingId = null;
  renderSteeringTray();
}

steeringClearBtn.addEventListener("click", clearSteeringQueue);

function sendSteeringItem(item) {
  if (
    !item
    || item.removing
    || steeringRemovalPending.has(item.id)
    || item.serverOwned
    || item.sent
    || resetRequested
    || pendingRequestDraft
    || !activeRequestId
    || !ws
    || ws.readyState !== WebSocket.OPEN
  ) return false;
  item.draft.conversationId = currentConvId;
  item.draft.userMessageId = item.id;
  item.draft.wsPayload = requestPayloadForDraft(item.draft, "steer");
  item.status = "sending";
  item.sent = true;
  try {
    ws.send(JSON.stringify(item.draft.wsPayload));
    renderSteeringTray();
    return true;
  } catch {
    item.sent = false;
    item.status = "paused";
    renderSteeringTray();
    return false;
  }
}

function flushLocalSteering() {
  if (!isGenerating || pendingRequestDraft) return;
  for (const item of steeringQueue) {
    if (!item.serverOwned && !item.sent) sendSteeringItem(item);
  }
}

function enqueueSteering(draft) {
  prepareRequestDraft(draft);
  const item = {
    id: draft.userMessageId || genId(),
    draft,
    displayText: draft.displayText,
    delivery: "steer",
    paused: false,
    status: "sending",
    sent: false,
    serverOwned: false,
  };
  draft.userMessageId = item.id;
  steeringQueue.push(item);
  renderSteeringTray();
  sendSteeringItem(item);
  return true;
}

function materializeSteeringItem(item, event) {
  const id = event.id || item?.id;
  if (!id || messageLog.some((message) => message.id === id)) return;
  const displayText = event.displayText || item?.displayText || item?.draft?.displayText || "";
  const imagePreviewUrls = item?.draft?.images?.map((image) => image.previewUrl).filter(Boolean) || [];

  // steering 是同一任务里的新用户边界。先把边界前已经可见的 assistant 内容
  // 固化成一段历史，再让后续内容从用户消息下方另起 bubble；刷新后的顺序因此
  // 仍是「回答片段 → 用户追加 → 回答续段」，不会聚合成一整段跑到追加消息后面。
  const priorText = assistantTxt;
  const priorBlocks = cloneJson(assistantBlocks);
  const priorRawMessages = cloneJson(assistantRawMessages);
  const priorEvents = cloneJson(assistantEvents);
  if (priorText || priorBlocks?.length) {
    messageLog.push({
      id: genId(),
      role: "assistant",
      text: priorText,
      blocks: priorBlocks,
      raw: priorRawMessages,
      events: priorEvents,
      cost: null,
      status: "complete",
    });
  }
  cleanupRunningTools();
  removeGenChip();
  assistantEl = null;
  assistantTxt = "";
  assistantBlocks = [];
  assistantRawMessages = [];
  assistantEvents = [];
  blockMap = {};
  prevTurnTexts = [];

  addMessage("user", displayText, imagePreviewUrls);
  messageLog.push({ id, role: "user", text: displayText, cost: null });
  saveCurrentConversation();
}

function materializeStartedSteering(raw) {
  const event = normalizeSteeringEvent(raw);
  const index = steeringQueue.findIndex((item) => item.id === event.id);
  if (index < 0) return false;
  const [item] = steeringQueue.splice(index, 1);
  materializeSteeringItem(item, event);
  steeringRemovalPending.delete(event.id);
  if (steeringEditingId === event.id) steeringEditingId = null;
  renderSteeringTray();
  return true;
}

function upsertSteeringFromEvent(raw) {
  const event = normalizeSteeringEvent(raw);
  if (!event.id || steeringRemovalPending.has(event.id)) return null;
  let item = steeringById(event.id);
  if (!item) {
    const draft = {
      composerText: event.composerText,
      text: event.composerText,
      displayText: event.displayText,
      mentionedNotes: [],
      images: [],
      noteFile: null,
      quote: null,
      model: selectedModel,
      permissionMode: selectedPermissionMode,
      effort: selectedEffort,
      profileId: _profileData.activeProfileId,
      conversationId: event.conversationId,
      userMessageId: event.id,
    };
    item = {
      id: event.id,
      draft,
      displayText: event.displayText,
      delivery: event.delivery,
      paused: event.paused,
      status: event.paused ? "paused" : "waiting",
      sent: true,
      serverOwned: true,
    };
    const insertAt = event.position == null
      ? steeringQueue.length
      : Math.max(0, Math.min(steeringQueue.length, event.position - 1));
    steeringQueue.splice(insertAt, 0, item);
  } else {
    item.serverOwned = true;
    item.sent = true;
    item.delivery = event.delivery;
    item.paused = event.paused;
    item.status = event.paused ? "paused" : "waiting";
    if (event.displayText) {
      item.displayText = event.displayText;
      item.draft.displayText = event.displayText;
    }
  }
  return item;
}

function applySteeringOrder(order) {
  const positions = new Map((order || []).map((id, index) => [String(id), index]));
  steeringQueue.sort((a, b) => {
    const ai = positions.has(a.id) ? positions.get(a.id) : Number.MAX_SAFE_INTEGER;
    const bi = positions.has(b.id) ? positions.get(b.id) : Number.MAX_SAFE_INTEGER;
    return ai - bi;
  });
}

function handleSteeringEvent(raw) {
  if (!String(raw?.type || "").startsWith("steering_")) return false;
  const event = normalizeSteeringEvent(raw);
  if (raw.type !== "steering_snapshot" && event.conversationId && event.conversationId !== currentConvId) {
    return true;
  }

  if (raw.type === "steering_snapshot") {
    const localItems = steeringQueue.filter((item) => !item.serverOwned);
    const priorItems = new Map(steeringQueue.map((item) => [item.id, item]));
    steeringQueue.length = 0;
    const snapshotItems = Array.isArray(raw.items) ? [...raw.items] : [];
    snapshotItems.sort((a, b) => (Number(a.position) || 0) - (Number(b.position) || 0));
    for (const snapshotRaw of snapshotItems) {
      const snapshot = normalizeSteeringEvent(snapshotRaw);
      if (
        !snapshot.id
        || !currentConvId
        || snapshot.conversationId !== currentConvId
      ) continue;
      const prior = priorItems.get(snapshot.id);
      if (prior) {
        prior.serverOwned = true;
        prior.sent = true;
        prior.delivery = snapshot.delivery;
        prior.paused = snapshot.paused;
        prior.status = steeringRemovalPending.has(snapshot.id)
          ? "sending"
          : (snapshot.paused ? "paused" : "waiting");
        prior.removing = steeringRemovalPending.has(snapshot.id);
        if (snapshot.displayText) {
          prior.displayText = snapshot.displayText;
          prior.draft.displayText = snapshot.displayText;
        }
        steeringQueue.push(prior);
      } else {
        const restored = upsertSteeringFromEvent(snapshotRaw);
        if (restored && steeringRemovalPending.has(snapshot.id)) {
          restored.removing = true;
          restored.status = "sending";
        }
      }
    }
    for (const local of localItems) {
      if (!steeringById(local.id)) steeringQueue.push(local);
    }
    for (const id of steeringRemovalPending) {
      sendSteeringCommand({ type: "steering_remove", userMessageId: id });
    }
    renderSteeringTray();
    flushLocalSteering();
    return true;
  }

  if (raw.type === "steering_queued" || raw.type === "steering_updated") {
    upsertSteeringFromEvent(raw);
    renderSteeringTray();
    return true;
  }

  if (raw.type === "steering_command_error") {
    const item = steeringById(event.id);
    if (raw.command === "steering_remove") {
      steeringRemovalPending.delete(event.id);
      if (item) {
        item.removing = false;
        item.status = item.paused ? "paused" : "waiting";
      }
    } else if (item) {
      item.status = raw.command === "steering_resume"
        ? "paused"
        : (item.paused ? "paused" : "waiting");
      if (raw.command === "steering_resume") item.paused = true;
    }
    showInlineError("待追加消息未更新，请重试。");
    renderSteeringTray();
    return true;
  }

  if (raw.type === "steering_reordered") {
    applySteeringOrder(raw.order);
    renderSteeringTray();
    return true;
  }

  if (raw.type === "steering_paused") {
    const ids = new Set((raw.userMessageIds || (event.id ? [event.id] : [])).map(String));
    for (const item of steeringQueue) {
      if (ids.size === 0 || ids.has(item.id)) {
        item.paused = true;
        item.status = "paused";
      }
    }
    renderSteeringTray();
    return true;
  }

  if (raw.type === "steering_applied" || raw.type === "steering_removed") {
    const index = steeringQueue.findIndex((item) => item.id === event.id);
    const item = index >= 0 ? steeringQueue[index] : null;
    if (raw.type === "steering_applied" || raw.reason === "fallback_started") {
      materializeSteeringItem(item, event);
    }
    if (index >= 0) steeringQueue.splice(index, 1);
    steeringRemovalPending.delete(event.id);
    if (steeringEditingId === event.id) steeringEditingId = null;
    renderSteeringTray();
    return true;
  }

  return true;
}

function resendPendingRequest() {
  if (
    !pendingRequestDraft?.wsPayload
    || resetRequested
    || !ws
    || ws.readyState !== WebSocket.OPEN
  ) return false;
  try {
    ws.send(JSON.stringify(pendingRequestDraft.wsPayload));
    return true;
  } catch {
    return false;
  }
}

function dispatchRequestDraft(draft) {
  if (
    !draft
    || isGenerating
    || resetRequested
    || pendingRequestDraft
    || !ws
    || ws.readyState !== WebSocket.OPEN
  ) return false;

  if (draft.text === "/clear") {
    resetRequested = true;
    if (!sendResetRequest()) return false;
    saveCurrentConversation();
    resetAssistantState();
    messagesEl.innerHTML = "";
    messageLog = []; currentConvId = genId(); currentSessionId = null;
    pendingRequestDraft = null;
    activeRequestId = null;
    clearTimeout(requestRetryTimer);
    requestRetryTimer = null;
    hidePopup();
    return true;
  }

  hidePopup();
  if (!draft.conversationId) draft.conversationId = currentConvId || genId();
  if (!currentConvId) currentConvId = draft.conversationId;
  const userMessageId = draft.userMessageId || genId();
  draft.userMessageId = userMessageId;
  prepareRequestDraft(draft);
  const imagePreviewUrls = draft.images.map((image) => image.previewUrl);
  const displayText = draft.displayText;
  if (!draft.rendered) {
    // If a previous request froze without a done/stopped event, assistantEl still
    // points to the old AI message element. Clear it so the upcoming response is
    // appended after this new user message, not inside the old AI bubble.
    resetAssistantState();
    addMessage("user", displayText, imagePreviewUrls);
    messageLog.push({ id: userMessageId, role: "user", text: displayText, cost: null });
    draft.rendered = true;
  }
  addTyping();
  setGenerating(true);
  lastWsEventAt = Date.now();

  const wsPayload = requestPayloadForDraft(draft);
  draft.wsPayload = wsPayload;
  pendingRequestDraft = draft;
  activeRequestId = userMessageId;
  try {
    ws.send(JSON.stringify(wsPayload));
  } catch {
    updateTypingStatus("连接中断，消息会在重连后自动发送…");
    try { ws.close(); } catch { }
    return true;
  }
  return true;
}

function submitRequest(textOverride = null, options = {}) {
  const text = String(textOverride ?? promptEl.value).trim();
  if (!text) return false;
  // 厂商清单是异步拉的。刚开页面就发 ">Kimi 任务" 时它可能还空着，那样会被
  // 当成普通消息发给当前模型，用户却以为派出去了——静默失败最难查。
  // 先补拉一次再重投。retriedProviders 保证只重投一次：拉取失败时清单仍是空的，
  // 没有这个标记就会无限打转。
  if (!_dispatchProvidersLoaded && !options.retriedProviders && looksLikeDispatchAttempt(text)) {
    ensureDispatchProvidersLoaded().then(() => {
      submitRequest(textOverride, { ...options, retriedProviders: true });
    });
    return true;
  }
  // 清单已就绪，但厂商名对不上（拼错、或那个账号被删了）。默认行为是退化成
  // 普通消息发给当前模型——用户却以为派出去了，而且回复看着像模像样，很难察觉。
  // 宁可拦下来说清楚。
  if (looksLikeDispatchAttempt(text) && !parseProviderDispatchText(text)) {
    const wanted = text.slice(1).split(/\s/)[0];
    const known = _dispatchProviders.map((p) => `>${dispatchTokenFor(p)}`).join("　");
    showInlineError(known
      ? `没有厂商叫「${wanted}」。可用：${known}`
      : `没有厂商叫「${wanted}」，也没读到任何已配置的厂商，去设置里看看。`);
    return false;
  }
  if (resetRequested) return false;
  if (isGenerating) {
    const draft = takeRequestDraft(textOverride, options);
    if (!draft) return false;
    return enqueueSteering(draft);
  }
  if (pendingRequestDraft || !ws || ws.readyState !== WebSocket.OPEN) return false;
  const draft = takeRequestDraft(textOverride, options);
  if (!draft) return false;
  return dispatchRequestDraft(draft);
}

function send() {
  return submitRequest(null, { consumeComposer: true });
}

(function() {
  const banner   = document.getElementById("git-banner");
  const labelBtn = document.getElementById("git-banner-label");
  const syncBtn  = document.getElementById("git-banner-sync");
  let pendingFiles = [];
  let syncTimer = null;

  function stripExt(name) { return name.replace(/\.(md|html?)$/i, ""); }

  const GIT_STATE_LABEL = { modified: "已修改", added: "新增", deleted: "已删除", renamed: "已重命名" };

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) => (
      { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
    ));
  }

  function renderBanner(files) {
    pendingFiles = files;
    if (!files.length) { banner.classList.remove("visible"); return; }
    banner.classList.add("visible");
    if (files.length === 1) {
      const tag = GIT_STATE_LABEL[files[0].state] || "改动";
      labelBtn.innerHTML = '<span id="git-banner-tag">' + tag + "</span>"
        + escapeHtml(stripExt(files[0].name));
    } else {
      labelBtn.textContent = files.length + " 处改动";
    }
  }

  function setFeedback(text, duration) {
    labelBtn.textContent = text;
    if (syncTimer) clearTimeout(syncTimer);
    if (duration) syncTimer = setTimeout(() => renderBanner(pendingFiles), duration);
  }

  async function fetchStatus() {
    try {
      const res = await fetch("/api/notes/git", { cache: "no-store" });
      const data = await res.json();
      if (!data.error) renderBanner(data.files || []);
    } catch {}
  }

  async function handleSync() {
    banner.classList.add("syncing");
    syncBtn.disabled = true;
    setFeedback("检查云端版本…");
    try {
      await fetch("/api/notes/git", {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ action: "pull" }),
      });
      setFeedback("AI 提炼同步摘要…");
      let message = "";
      try {
        const ai = await fetch("/api/notes/git/ai-log", { method: "POST" });
        const d = await ai.json();
        message = d.message || d.fallback || "";
      } catch {}
      if (!message) message = "同步笔记于 " + new Date().toLocaleDateString("zh-CN");
      setFeedback("保存「" + message + "」…");
      const res = await fetch("/api/notes/git", {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ action: "push", message }),
      });
      const d = await res.json();
      if (d.error) throw new Error(d.error);
      setFeedback("云端同步成功 ✓", 3000);
      await fetchStatus();
    } catch (err) {
      setFeedback(err.message || "同步失败", 4000);
    } finally {
      banner.classList.remove("syncing");
      syncBtn.disabled = false;
    }
  }

  labelBtn.addEventListener("click", () => {
    postParentMessage({ type: "open-git-tab" });
  });
  syncBtn.addEventListener("click", () => void handleSync());

  fetchStatus();
  setInterval(fetchStatus, 30000);
})();

// ── Visual viewport fix (mobile keyboard avoidance) ───────────
// On iOS Safari the layout viewport does NOT shrink when the virtual keyboard
// appears — the keyboard just overlays the page. But visualViewport.height DOES
// shrink. We track it and resize #app accordingly so that #messages (flex:1)
// auto-shrinks and #input-wrap stays pinned above the keyboard.
const _appEl = document.getElementById("app");
// When embedded inside the inkfellow notes drawer (an <iframe>), the parent page
// already lifts the whole drawer above the keyboard via --keyboard-height. Here in
// the iframe, window.visualViewport.height reports the *full-screen* visible height,
// not this drawer's height — so self-managing #app height would double-compensate in
// the wrong reference frame and leave the input mispositioned. Only own keyboard
// avoidance when we are the top-level page; otherwise let #app fill the iframe
// (CSS height:100%) so #input-wrap pins to the drawer's bottom edge.
const _embedded = window.self !== window.top;
let _lastVVHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;

function syncHeight() {
  const vv = window.visualViewport;
  if (!vv) { _appEl.style.height = ""; return; }
  const h = vv.height;
  _appEl.style.height = h + "px";
  if (h < _lastVVHeight) scrollBottom();
  _lastVVHeight = h;
}

function onKeyboardScroll() {
  const vv = window.visualViewport;
  if (!vv) return;
  if (vv.height < _lastVVHeight) scrollBottom();
  _lastVVHeight = vv.height;
}

if (window.visualViewport) {
  const handler = _embedded ? onKeyboardScroll : syncHeight;
  window.visualViewport.addEventListener("resize", handler, { passive: true });
  window.visualViewport.addEventListener("scroll", handler, { passive: true });
}
if (!_embedded) syncHeight();
else _appEl.style.height = "";

function sendResetRequest() {
  if (!resetRequested || !ws || ws.readyState !== WebSocket.OPEN) return false;
  try {
    ws.send(JSON.stringify({ reset: true }));
    return true;
  } catch {
    return false;
  }
}

function sendStopRequest() {
  if (!isGenerating) {
    stopRequested = false;
    stopResendPending = false;
    setGenerating(false);
    return false;
  }
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    stopRequested = true;
    stopResendPending = true;
    // 重连时会自动补发（见 ws.onopen），但用户按下之后必须立刻看到点动静
    updateTypingStatus("连接中断，重连后会立刻停止");
    syncComposerAction();
    return false;
  }
  stopRequested = true;
  stopResendPending = false;
  syncComposerAction();
  updateTypingStatus("正在停止...");
  if (!genChipEl && assistantEl) showGenChip("正在停止...");
  else updateGenChip("正在停止...");
  try {
    ws.send(JSON.stringify({ stop: true, userMessageId: activeRequestId }));
    return true;
  } catch {
    stopResendPending = true;
    syncComposerAction();
    updateTypingStatus("停止请求未送达，请重试");
    return false;
  }
}

function positionHeaderDropdown(btn, dropdown, align = "left", upward = false) {
  dropdown.classList.add("open");
  const rect = btn.getBoundingClientRect();
  const width = dropdown.offsetWidth;
  const viewportWidth = window.innerWidth;
  let left = align === "right" ? rect.right - width : rect.left;
  left = Math.max(8, Math.min(left, viewportWidth - width - 8));
  dropdown.style.left = `${left}px`;
  if (upward) {
    dropdown.classList.add("open-up");
    dropdown.style.top = "auto"; // must override CSS `top:0`
    dropdown.style.bottom = `${window.innerHeight - rect.top + 5}px`;
    dropdown.style.maxHeight = `${rect.top - 16}px`;
  } else {
    const viewportHeight = window.innerHeight;
    dropdown.style.bottom = "auto";
    dropdown.style.maxHeight = `${viewportHeight - rect.bottom - 16}px`;
    dropdown.style.top = `${Math.min(rect.bottom + 5, viewportHeight - 12)}px`;
  }
}

async function deleteConversation(id) {
  try { await fetch(`api/history/${id}`, { method: "DELETE" }); } catch { }
  /* 删掉的对话要从所有地方消失，不然它还挂在未读/最近用过里，
     下一轮 switcherEntries 会再给它分配一个槽位，看起来像删不掉。 */
  releaseConvSlot(id);
  sessionUnread.delete(id);
  sessionsRunning.delete(id);
  sessionsAwaiting.delete(id);

  if (recentAt >= 0) recentConvIds.splice(recentAt, 1);
  if (currentConvId === id) currentConvId = genId();

    _historyCache = _historyCache.filter(h => h.id !== id);

  } else {
    renderHistoryList();

}

const esc = (s) => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
/* ══════════════════════════════════════════════════════════
   多开：每个对话现在有自己的 runtime，可以同时跑好几个。
   这里管的是「哪个在跑、哪个在等你、哪个跑完了你还没看」。

   状态分三档，抢注意力的程度依次递减：
     awaiting  在等你回话——它卡住了，不点就一直卡着，最该被看见
     running   在干活——不需要你，安静转圈就好
     unread    跑完了你还没切过去看——这是你走开之后回来的钩子

   数据以服务端的 sessions_snapshot 为准；后台对话来了新内容也顺手标未读。
   ══════════════════════════════════════════════════════════ */
const sessionsRunning = new Set();
const sessionsAwaiting = new Set();
const sessionUnread = new Set();
let sessionLimit = 10;

function applySessionsSnapshot(ev) {
  const nextRunning = new Set(ev.running ?? []);
  // 从「在跑」掉到「不在跑」，而你当时不在看它 —— 那就是一条未读
  for (const id of sessionsRunning) {
    if (!nextRunning.has(id) && id !== currentConvId) sessionUnread.add(id);
  }
  sessionsRunning.clear();
  for (const id of nextRunning) sessionsRunning.add(id);
  sessionsAwaiting.clear();
  for (const id of ev.awaiting ?? []) sessionsAwaiting.add(id);
  if (Number.isFinite(ev.limit)) sessionLimit = ev.limit;
  sessionUnread.delete(currentConvId);   // 正看着的那个不该有未读
  renderSessionBadges();
}

function noteBackgroundEvent(ev) {
  const id = ev.conversationId;
  if (!id || id === currentConvId) return;
  // 只认「产生了新内容」的事件；流式增量太碎，不值得为它重画
  if (ev.type === "assistant" || ev.type === "done" || ev.type === "error") {
    sessionUnread.add(id);
    renderSessionBadges();
  }
}

function sessionBadgeState(id) {
  if (sessionsAwaiting.has(id)) return "awaiting";
  if (sessionsRunning.has(id)) return "running";
  if (sessionUnread.has(id)) return "unread";
  return "";
}

function sessionBadgeTitle(state) {
  if (state === "awaiting") return "这个对话在等你回话";
  if (state === "running") return "正在进行";
  if (state === "unread") return "已完成，还没看过";
  return "";
}

/** 历史列表里每一项的状态点，外加顶部那排「正在跑」的圆点。 */
function renderSessionBadges() {
  document.querySelectorAll(".history-item[data-id]").forEach((el) => {
    const state = sessionBadgeState(el.dataset.id);
    let badge = el.querySelector(".session-badge");
    if (!state) { badge?.remove(); return; }
    if (!badge) {
      badge = document.createElement("span");
      badge.className = "session-badge";
      el.prepend(badge);
    }
    badge.dataset.state = state;
    badge.title = sessionBadgeTitle(state);
  });
  renderSessionSwitcher();
}


/* ══════════════════════════════════════════════════════════
   会话切换器
   多开之后真正费劲的不是「切不过去」，是「不知道自己在哪个对话里」。
   所以按钮上始终显示当前对话名；点开的列表也只放最近这几个，
   一年多攒下的 140 个仍然归历史抽屉管——那是归档，不是工作区。

   排序按最近用过（MRU），不是按时间倒序：你刚从 A 切到 B，想切回 A 时
   它就该在第一个，而不是沉到某个按创建时间排的位置里。
   ══════════════════════════════════════════════════════════ */
/* 快捷键槽位：index + 1 就是 Ctrl+N 的那个 N。
   一旦分配就绑住这个对话不再挪动——数字要能形成肌肉记忆，就不能跟着
   活跃状态跳。槽位被腾空时留成 null，下一个新对话来填补这个洞，
   已有对话的编号始终不动。 */
const SWITCHER_MAX_ITEMS = 9;
const convSlots = [];

function assignConvSlot(id) {
  if (!id || convSlots.includes(id)) return;
  const hole = convSlots.indexOf(null);
  if (hole >= 0) { convSlots[hole] = id; return; }
  if (convSlots.length < SWITCHER_MAX_ITEMS) { convSlots.push(id); return; }
  /* 槽位满了，挤掉最久没碰过、而且没在动的那个。全都在用就先不给槽位——
     宁可这个对话暂时没有快捷键，也不能把正在跑的挤下去。 */
  const idle = convSlots.filter(x => x && x !== currentConvId
    && !sessionsRunning.has(x) && !sessionsAwaiting.has(x) && !sessionUnread.has(x));
  if (idle.length === 0) return;
  const victim = idle.reduce((oldest, x) => {
    const rank = (v) => { const i = recentConvIds.indexOf(v); return i < 0 ? Infinity : i; };
    return rank(x) > rank(oldest) ? x : oldest;
  });
  convSlots[convSlots.indexOf(victim)] = id;
}

function releaseConvSlot(id) {
  const at = convSlots.indexOf(id);
  if (at >= 0) convSlots[at] = null;
}
// 快捷键标注按平台走：Windows 上写 ⌘ 没人认得
const MOD_LABEL = /mac|iphone|ipad/i.test(navigator.userAgentData?.platform || navigator.platform || "")
  ? "⌘" : "Ctrl+";
const recentConvIds = [];

function touchRecentConversation(id) {
  if (!id) return;
  const at = recentConvIds.indexOf(id);
  if (at >= 0) recentConvIds.splice(at, 1);
  recentConvIds.unshift(id);
  if (recentConvIds.length > 30) recentConvIds.length = 30;
}

function convTitleOf(id) {
  if (!id) return "新对话";
  const found = _historyCache?.find(h => h.id === id);
  if (found) return found.title || "对话";
  // 还没发过第一条消息的对话不在历史里——它就是那个空白的新对话
  return id === currentConvId ? "新对话" : "对话";
}

/**
 * 切换器里的对话，按槽位顺序（也就是 Ctrl+N 的顺序）。
 * 返回的数组里可能有 null——那是被腾空的槽位，编号得留着，
 * 不然后面所有对话的数字都会往前挪一位。
 */
function switcherEntries() {
  // 当前的、正在动的、最近用过的，都该有个槽位
  assignConvSlot(currentConvId);
  for (const id of [...sessionsAwaiting, ...sessionsRunning, ...sessionUnread]) assignConvSlot(id);
  for (const id of recentConvIds.slice(0, SWITCHER_MAX_ITEMS)) assignConvSlot(id);
  return convSlots.slice(0, SWITCHER_MAX_ITEMS);
}

function switcherNoteOf(id) {
  const state = sessionBadgeState(id);
  if (state === "awaiting") return "等你回话";
  if (state === "running") return "正在跑";
  if (state === "unread") return "刚完成";
  return "";
}

function renderSessionSwitcher() {
  const titleEl = document.getElementById("session-switcher-title");
  const badgeEl = document.getElementById("session-switcher-badge");
  if (!titleEl || !badgeEl) return;
  titleEl.textContent = currentConvId ? convTitleOf(currentConvId) : "新对话";
  const state = currentConvId ? sessionBadgeState(currentConvId) : "";
  if (state) { badgeEl.dataset.state = state; badgeEl.hidden = false; }
  else { badgeEl.hidden = true; }

  // 除了正看着的这个，还有几个对话在动
  const countEl = document.getElementById("session-switcher-count");
  if (!countEl) return;
  const others = new Set([...sessionsRunning, ...sessionsAwaiting, ...sessionUnread]);
  others.delete(currentConvId);
  if (others.size > 0) {
    countEl.textContent = String(others.size);
    countEl.title = `另有 ${others.size} 个对话在进行或有新内容`;
    countEl.hidden = false;
  } else {
    countEl.hidden = true;
  }
}

function renderSwitcherMenu() {
  const menu = document.getElementById("session-switcher-menu");
  if (!menu) return;
  const ids = switcherEntries();
  const total = _historyCache?.length ?? 0;
  const rows = ids.map((id, index) => {
    if (!id) return "";            // 空槽不画，但它占着的编号留给原主
    const state = sessionBadgeState(id);
    const note = switcherNoteOf(id);
    const isCurrent = id === currentConvId;
    return `<button type="button" class="switcher-item${isCurrent ? " current" : ""}" role="menuitem" data-id="${esc(id)}">
      ${state ? `<span class="session-badge" data-state="${state}"></span>` : `<span class="session-badge" style="background:transparent"></span>`}
      <span class="switcher-item-title">${esc(convTitleOf(id))}</span>
      ${note ? `<span class="switcher-item-note">${note}</span>` : ""}
      <span class="switcher-item-key">${index < 9 ? MOD_LABEL + (index + 1) : ""}</span>
    </button>`;
  }).join("");
  menu.innerHTML = (rows || `<div class="switcher-all" style="cursor:default">还没有别的对话</div>`)
    + `<div class="switcher-divider"></div>`
    + `<button type="button" class="switcher-all" data-open-history="1">查看全部 ${total || ""} 个对话 →</button>`;
}

function openSwitcher() {
  const menu = document.getElementById("session-switcher-menu");
  const btn = document.getElementById("btn-session-switcher");
  if (!menu || !btn) return;
  renderSwitcherMenu();
  menu.hidden = false;
  btn.setAttribute("aria-expanded", "true");
}

function closeSwitcher() {
  const menu = document.getElementById("session-switcher-menu");
  const btn = document.getElementById("btn-session-switcher");
  if (!menu || !btn) return;
  menu.hidden = true;
  btn.setAttribute("aria-expanded", "false");
}

function switcherIsOpen() {
  return document.getElementById("session-switcher-menu")?.hidden === false;
}

/** 切到某个对话；列表里只有 id 时从缓存补出完整记录。 */
async function switchToConversation(id) {
  if (!id || id === currentConvId) { closeSwitcher(); return; }
  closeSwitcher();
  const conv = _historyCache?.find(h => h.id === id) ?? { id };
  await loadConversation(conv);
}

document.getElementById("btn-session-switcher")?.addEventListener("click", (e) => {
  e.stopPropagation();
  if (switcherIsOpen()) closeSwitcher(); else openSwitcher();
});

document.getElementById("session-switcher-menu")?.addEventListener("click", async (e) => {
  if (e.target.closest?.("[data-open-history]")) {
    closeSwitcher();
    await openHistoryPanel();
    return;
  }
  const item = e.target.closest?.(".switcher-item");
  if (item) await switchToConversation(item.dataset.id);
});

document.addEventListener("click", (e) => {
  if (!switcherIsOpen()) return;
  if (e.target.closest?.("#session-switcher")) return;
  closeSwitcher();
});

/* 快捷键。挂在这个页面上就够了——聊天本来就在这个 iframe 里，
   要切对话的时候焦点几乎总在这儿。 */
document.addEventListener("keydown", (e) => {
  if (e.isComposing) return;
  const mod = e.metaKey || e.ctrlKey;

  if (e.key === "Escape" && switcherIsOpen()) {
    e.preventDefault();
    closeSwitcher();
    return;
  }

  // Ctrl/⌘ + Tab：在最近两个之间来回切。开着好几个时，来回对照是最常见的动作
  if (mod && e.key === "Tab") {
    const previous = recentConvIds.find(id => id !== currentConvId);
    if (!previous) return;
    e.preventDefault();
    void switchToConversation(previous);
    return;
  }

  // Ctrl/⌘ + 1..9：直达第 N 个槽位。槽位是稳定的，同一个对话永远同一个数字
  if (mod && !e.shiftKey && !e.altKey && /^[1-9]$/.test(e.key)) {
    const target = switcherEntries()[Number(e.key) - 1];
    if (!target) return;
    e.preventDefault();
    void switchToConversation(target);
  }
});

async function loadConversation(conv) {
  /* 以前这里拦住「生成中不许切走」——那是单会话时代的限制：只有一个 runtime，
     切走等于把正在跑的那轮丢了。现在每个对话有自己的 runtime，切走它继续跑，
     回来接着看，这正是多开的意义。 */
  await saveCurrentConversation();
  clearMentionNotes();
  // 列表接口只返回摘要，点击时按需拉取完整内容
  if (!conv.messages) {
    try {
      const res = await fetch(`api/history/${conv.id}`);
      if (res.ok) conv = await res.json();
    } catch { }
  }
  messagesEl.innerHTML = "";
  messageLog = conv.messages.map(m => ({
    id: m.id ?? null,
    role: m.role,
    text: m.text,
    blocks: m.blocks ?? null,
    raw: m.raw ?? null,
    events: m.events ?? null,
    cost: m.cost ?? null,
    status: m.status ?? null,
  }));
  for (const msg of conv.messages) {
    const hasAssistantBlocks = msg.role === "assistant" && Array.isArray(msg.blocks) && msg.blocks.length > 0;
    const el = addMessage(msg.role, hasAssistantBlocks ? "" : msg.text);
    if (hasAssistantBlocks) {
      renderAssistantBlocks(el.querySelector(".msg-body"), msg.blocks);
    }
  }
  currentConvId = conv.id;
  currentSessionId = conv.sessionId;
  if (conv.sessionId && ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ setSession: conv.sessionId, conversationId: conv.id }));
  }
  /* 切到的这个对话可能正在后台跑。按它的真实状态恢复输入区，
     否则会出现「明明在跑，输入框却显示可以发送」。 */
  sessionUnread.delete(conv.id);
  touchRecentConversation(conv.id);
  renderSessionSwitcher();
  const targetRunning = sessionsRunning.has(conv.id);
  setGenerating(targetRunning);
  if (targetRunning) addTyping(); else removeTyping();
  renderSessionBadges();
  closeHistoryPanel();
  updateBackgroundActivity();   // 历史里的编队卡由 renderAssistantBlocks 重建，活动条要跟着重算
  scrollBottom();
}

async function startNewConversation() {
  await saveCurrentConversation();
  pendingRequestDraft = null;
  activeRequestId = null;
  clearTimeout(requestRetryTimer);
  requestRetryTimer = null;
  steeringQueue.length = 0;
  steeringRemovalPending.clear();
  steeringEditingId = null;
  renderSteeringTray();
  clearTimeout(errorCompletionTimer);
  errorCompletionTimer = null;
  clearAskUserQuestion();
  resetAssistantState();
  setGenerating(false);
  removeTyping();
  clearMentionNotes();
  messagesEl.innerHTML = "";
  messageLog = [];
  /* 空对话也要有身份：事件路由靠 conversationId 比对，这里留 null 的话
     判断会短路，别的对话正在跑的回复会直接渲染进这个空窗口。
     没发消息之前它不会在服务端留下任何记录，所以提前分配是安全的。 */
  currentConvId = genId();
  currentSessionId = null;
  renderSessionSwitcher();
  resetRequested = true;
  sendResetRequest();
}

async function openHistoryPanel() {
  // 立即打开面板（无延迟）
  historyDropdown.classList.add("open");
  historyBackdrop.classList.add("open");
  closeHeaderPickers(); // 互斥
  // 有缓存先渲染缓存，同时后台刷新；没缓存才等 fetch
  if (_historyCache !== null) {
    renderHistoryFromData(_historyCache);
    renderHistoryList(); // 后台静默刷新
  } else {
    await renderHistoryList();
  }
}

function closeHistoryPanel() {
  historyDropdown.classList.remove("open");
  historyBackdrop.classList.remove("open");
}

function formatRelDate(iso) {
  const d = new Date(iso);
  const now = new Date();
  const diffH = (now - d) / 3600000;
  if (diffH < 1) return "刚刚";
  if (diffH < 24) return `${Math.floor(diffH)} 小时前`;
  const diffD = Math.floor(diffH / 24);
  if (diffD < 7) return `${diffD} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "numeric", day: "numeric" });
}

// ── Action Sheet (mobile) ──────────────────────────────────
const _actionSheet = document.getElementById("action-sheet");
const _actionSheetBackdrop = document.getElementById("action-sheet-backdrop");
let _actionSheetConvId = null;

function openActionSheet(convId) {
  _actionSheetConvId = convId;
  _actionSheetBackdrop.classList.add("open");
  _actionSheet.classList.add("open");
}

function closeActionSheet() {
  _actionSheetBackdrop.classList.remove("open");
  _actionSheet.classList.remove("open");
  _actionSheetConvId = null;
}

_actionSheetBackdrop.addEventListener("click", closeActionSheet);
document.getElementById("action-sheet-cancel").addEventListener("click", closeActionSheet);

document.getElementById("action-sheet-delete").addEventListener("click", () => {
  const convId = _actionSheetConvId;
  closeActionSheet();
  if (!convId) return;
  const item = document.querySelector(`.history-item[data-id="${convId}"]`);
  if (item && !item.classList.contains("deleting")) {
    item.style.height = item.offsetHeight + "px";
    void item.offsetHeight;
    item.classList.add("deleting");
    item.style.height = "0px";
    setTimeout(() => deleteConversation(convId), 300);
  } else {
    deleteConversation(convId);
  }
});

document.getElementById("action-sheet-rename").addEventListener("click", () => {
  const convId = _actionSheetConvId;
  closeActionSheet();
  if (!convId) return;
  const item = document.querySelector(`.history-item[data-id="${convId}"]`);
  if (item) startInlineRename(item, convId);
});

function startInlineRename(item, convId) {
  const titleEl = item.querySelector(".history-item-title");
  if (!titleEl) return;
  const originalTitle = titleEl.textContent;
  const actionsEl = item.querySelector(".history-item-actions");
  const moreBtn = item.querySelector(".history-item-more");

  const input = document.createElement("input");
  input.className = "history-item-title-input";
  input.value = originalTitle;
  input.setAttribute("aria-label", "重命名对话");
  titleEl.replaceWith(input);
  if (actionsEl) actionsEl.style.visibility = "hidden";
  if (moreBtn) moreBtn.style.visibility = "hidden";
  input.focus();
  input.select();

  let committed = false;

  const commit = async () => {
    if (committed) return;
    committed = true;
    const newTitle = input.value.trim() || originalTitle;
    const newTitleEl = document.createElement("div");
    newTitleEl.className = "history-item-title";
    newTitleEl.textContent = newTitle;
    input.replaceWith(newTitleEl);
    if (actionsEl) actionsEl.style.visibility = "";
    if (moreBtn) moreBtn.style.visibility = "";
    if (newTitle !== originalTitle) {
      const conv = _historyCache?.find(h => h.id === convId);
      if (conv) {
        conv.title = newTitle;
        fetch(`api/history/${convId}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(conv),
        }).catch(() => {});
      }
    }
  };

  const cancel = () => {
    if (committed) return;
    committed = true;
    const restoredEl = document.createElement("div");
    restoredEl.className = "history-item-title";
    restoredEl.textContent = originalTitle;
    input.replaceWith(restoredEl);
    if (actionsEl) actionsEl.style.visibility = "";
    if (moreBtn) moreBtn.style.visibility = "";
  };

  input.addEventListener("keydown", (ev) => {
    if (ev.key === "Enter") { ev.preventDefault(); commit(); }
    if (ev.key === "Escape") { ev.preventDefault(); cancel(); }
  });
  input.addEventListener("blur", commit);
}

function renderHistoryFromData(history) {
  queueMicrotask(renderSessionBadges);   // 列表 innerHTML 刷完再补状态点

  const listEl = document.getElementById("history-list");
  if (history.length === 0) {
    listEl.innerHTML = '<div class="history-empty">暂无历史对话</div>';
    return;
  }

  listEl.innerHTML = history.map(conv => {
    const isCurrent = conv.id === currentConvId;
    const msgCount = conv.messageCount ?? (conv.messages ? conv.messages.length : 0);
    return `<div class="history-item${isCurrent ? " current" : ""}" data-id="${conv.id}">
      <div class="history-item-info">
        <div class="history-item-title">${esc(conv.title || "对话")}</div>
        <div class="history-item-meta">${formatRelDate(conv.date)} · ${msgCount} 条消息</div>
      </div>
      <div class="history-item-actions">
        <button class="history-item-rename" data-rename="${conv.id}" title="重命名此对话" aria-label="重命名此对话">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true">
            <path d="M8.5 2L11 4.5L4.5 11H2V8.5L8.5 2Z" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button class="history-item-del" data-del="${conv.id}" title="删除此对话" aria-label="删除此对话">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true">
            <path d="M2 3.5h9M5.5 3.5V2.5h2v1M4 3.5l.6 7.5h3.8l.6-7.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
      <button class="history-item-more" data-more="${conv.id}" aria-label="更多操作" title="更多操作">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <circle cx="8" cy="3" r="1.3"/><circle cx="8" cy="8" r="1.3"/><circle cx="8" cy="13" r="1.3"/>
        </svg>
      </button>
    </div>`;
  }).join("");

  listEl.querySelectorAll(".history-item").forEach(item => {
    item.addEventListener("click", async (e) => {
      if (e.target.closest(".history-item-del") || e.target.closest(".history-item-rename") || e.target.closest(".history-item-more") || e.target.closest(".history-item-title-input")) return;
      const conv = history.find(h => h.id === item.dataset.id);
      if (conv) loadConversation(conv);
    });
  });

  listEl.querySelectorAll(".history-item-del").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const item = btn.closest(".history-item");
      if (item && !item.classList.contains("deleting")) {
        item.style.height = item.offsetHeight + "px";
        void item.offsetHeight;
        item.classList.add("deleting");
        item.style.height = "0px";
        setTimeout(() => {
          deleteConversation(btn.dataset.del);
        }, 300);
      } else if (!item) {
        deleteConversation(btn.dataset.del);
      }
    });
  });

  listEl.querySelectorAll(".history-item-rename").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const item = btn.closest(".history-item");
      startInlineRename(item, btn.dataset.rename);
    });
  });

  listEl.querySelectorAll(".history-item-more").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const item = btn.closest(".history-item");
      openActionSheet(btn.dataset.more);
    });
  });
}

async function renderHistoryList() {
  const listEl = document.getElementById("history-list");
  if (_historyCache === null) {
    const skeletonItem = (w1, w2) =>
      `<div class="history-skeleton-item">
        <div class="history-skeleton-line" style="height:13px;width:${w1}%"></div>
        <div class="history-skeleton-line" style="height:10px;width:${w2}%"></div>
      </div>`;
    listEl.innerHTML = skeletonItem(68, 38) + skeletonItem(52, 44) + skeletonItem(75, 32);
  }
  const history = await fetchHistory();
  renderHistoryFromData(history);
}

document.getElementById("btn-history").addEventListener("click", (e) => {
  e.stopPropagation();
  if (historyDropdown.classList.contains("open")) closeHistoryPanel();
  else openHistoryPanel();
});
document.getElementById("btn-new").addEventListener("click", startNewConversation);
document.getElementById("history-close").addEventListener("click", closeHistoryPanel);
historyBackdrop.addEventListener("click", closeHistoryPanel);


// Rotating placeholder logic
(function initRotatingPlaceholder() {
  const promptEl = document.getElementById("prompt");
  if (!promptEl) return;
  const placeholders = [
    "Message inkfellow...",
    "试试输入：帮我修改这份文件...",
    "试试输入：根据这些资料写一篇文章...",
    "试试输入：帮我梳理一下当前的知识库..."
  ];
  let idx = 0;
  setInterval(() => {
    // Only update if input is not focused and empty
    if (document.activeElement !== promptEl && promptEl.value.trim() === "") {
      idx = (idx + 1) % placeholders.length;
      promptEl.setAttribute("placeholder", placeholders[idx]);
    }
  }, 4000);
})();
